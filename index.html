<script>
const UNITS = [
 {title:'从坐标到距离',short:'认识 |x|',tag:'起点 · 到原点',goal:'分清“点在哪一边”和“点离原点多远”，用距离解释 |x|。',mode:'origin',steps:[
  {title:'负数的位置，正的距离',a:0,b:4,start:2,target:-3,task:'把点 P 拖到 −3，观察它到原点 O 的距离。',read:'数轴上的数告诉我们位置：正数在原点右侧，负数在左侧。现在把点放到 −3。它虽然在左侧，但从原点走到它，仍然要走 3 个单位。<strong>位置可以用负数表示，距离不能是负数。</strong>',ask:'P 的坐标是 −3，它到原点的距离是多少？',options:['−3','3','0'],answer:1,why:'从 −3 走到 0，要向右走 3 个单位。因此 |−3| = 3。“−”说明在左边，绝对值说明有多远。',line:'|−3| = 3',note:'|x| 表示坐标为 x 的点到原点的距离。'},
  {title:'换到另一边，距离变了吗？',a:0,b:4,start:-3,target:3,task:'把点 P 从 −3 移到 3，比较两次的距离。',read:'刚才 P 在 −3，现在让它走到原点右侧的 3。移动时，你会看到距离先减小到 0，再增大。<strong>原点两侧可能有两个点，它们到原点一样远。</strong>',ask:'−3 和 3 到原点的距离有什么关系？',options:['−3 离原点更远','3 离原点更远','一样远，都是 3'],answer:2,why:'两点分处原点两侧，各离原点 3 个单位。因此 |−3| = |3| = 3。知道距离是 3，还不能断定坐标就是 3。',line:'|x| = 3 ⇒ x = −3 或 x = 3',note:'距离确定时，要检查原点的左右两侧。'},
  {title:'距离可以等于 0 吗？',a:0,b:4,start:3,target:0,task:'把点 P 拖到原点，让 P 与 O 重合。',read:'继续向原点移动，距离越来越小。当 P 和原点重合时，中间没有路要走，距离就是 0。再往左移动，距离会重新增大，<strong>不会降到负数。</strong>',ask:'下面哪一个判断正确？',options:['|x| 可以等于 −2','|x| ≥ 0，且只有 x = 0 时等于 0','|x| 永远大于 0'],answer:1,why:'距离的最小值是 0，所以绝对值非负。|x| = 0 只有 x = 0；|x| = −2 没有解。别把“非负”看成“正”：0 也包含在内。',line:'|x| ≥ 0；|x| = 0 ⇔ x = 0',note:'距离不会是负数，0 是可以取到的。'},
  {title:'读懂一道绝对值方程',a:0,b:4,start:0,target:-4,task:'先找到原点左侧、到原点距离为 4 的点。',read:'遇到 |x| = 4，先把符号翻译成一句话：“找出到原点距离为 4 的点。”先向左走 4，再向右走 4，就能找到所有位置。<strong>解方程，其实是在数轴上找点。</strong>',ask:'|x| = 4 的全部解是？',options:['只有 x = 4','只有 x = −4','x = −4 或 x = 4'],answer:2,why:'你刚找到左侧的 −4；右侧的 4 也满足要求。一般地，r > 0 时 |x| = r 有两个解 ±r；r = 0 时一个解；r < 0 时无解。',line:'先读距离 → 找中心 0 → 向两边找点',note:'本关用“距离”思考，不用急着背去绝对值的规则。'}],recap:'绝对值说的是距离。|x| 是 P = x 到 O = 0 的距离；距离非负。|x| = r 要按 r > 0、r = 0、r < 0 分情况。'},
 {title:'把原点换成定点',short:'读懂 |x−a|',tag:'进阶 · 两点距离',goal:'看到 |x−a| 就能说清谁到谁的距离，并表示任意两点间的距离。',mode:'single',steps:[
  {title:'中心不再是 0，而是 3',a:3,b:6,start:5,target:1,task:'A 固定在 3，把 P 拖到 1，数一数 PA。',read:'现在我们关心的不是 P 到原点，而是 P 到 A = 3 的距离。P 在 1 时，与 A 相隔 2 个单位。用坐标作差得到 1 − 3 = −2，再取绝对值，就得到距离 2。',ask:'|x−3| 表示谁到谁的距离？',options:['P = x 到 A = 3','P = x 到 A = −3','坐标为 x 的点 P 到原点'],answer:0,why:'PA = |x−3|。把它与 |x−a| 对照，a = 3，所以固定点是 3。减号是“作差”的符号，不代表固定点在 −3。',line:'PA = |x−a|；这里 a = 3',note:'先认准固定点 a，再看动点 x。'},
  {title:'到 3 的距离为 2，有几个位置？',a:3,b:6,start:1,target:5,task:'刚才 P = 1 时 PA = 2。再到 A 右侧找另一个位置。',read:'你已经找到 A 左边的 1。到 A 的距离为 2，还可以从 3 向右走 2，走到 5。因此 |x−3| = 2 的中心是 3，左右各走 2。',ask:'|x−3| = 2 的全部解是？',options:['x = −2 或 x = 2','x = 1 或 x = 5','只有 x = 5'],answer:1,why:'3 − 2 = 1，3 + 2 = 5。一般地，r > 0 时 |x−a| = r 的解为 x = a−r 或 a+r；r = 0 时只有 x = a；r < 0 时无解。',line:'以 a 为中心，向左、向右各走 r',note:'不要把中心 a 忘掉，答案通常不是 ±r。'},
  {title:'里面是加号，固定点在哪？',a:-2,b:4,start:0,target:3,task:'A 固定在 −2，把 P 拖到 3，观察 PA。',read:'|x+2| 看起来没有“减去 a”。把加法改写成减去一个负数：<strong>|x+2| = |x−(−2)|</strong>。这时 a = −2，所以它表示 P 到 −2 的距离。',ask:'P = 3 时，|x+2| 的值是多少？',options:['1','−5','5'],answer:2,why:'从 −2 走到 3，要走 5 个单位：|3+2| = 5。固定点是 −2，不是 2。认不清中心时，先写成 |x−a| 的样子。',line:'|x+2| = |x−(−2)| = PA',note:'“加 2”对应固定点 −2；“减 3”对应固定点 3。'},
  {title:'任意两点，都可以这样表示',a:-2,b:4,start:0,target:4,task:'让 P 到达 B = 4。此时 PA 就是 AB。',read:'当两个点都固定时，设 A 的坐标是 a，B 的坐标是 b，它们的距离是 <strong>AB = |b−a| = |a−b|</strong>。先做差再取绝对值，能保证从哪边算都一样。',ask:'A = −2、B = 4 的距离 AB 等于？',options:['|4−(−2)| = 6','|4+(−2)| = 2','−2−4 = −6'],answer:0,why:'数轴上右边的数减左边的数，就是距离：4−(−2)=6。注意，不能普遍用两个绝对值相加表示 AB：例如 A = 2、B = 5，AB=3，而 |2|+|5|=7。',line:'AB = |b−a|；若 a < b，则 AB = b−a',note:'两点距离 = 坐标之差的绝对值。'}],recap:'坐标为 x 的点 P 到坐标为 a 的点 A 的距离是 PA = |x−a|。A = a、B = b 的距离是 AB = |b−a|。绝对值里面是“两个坐标作差”，不能随意改成相加。'},
 {title:'两段距离，怎样相加',short:'探究距离和',tag:'核心一 · 距离和',goal:'解释点在左侧、中间、右侧时，PA+PB 为什么会不同。',mode:'sum',steps:[
  {title:'P 在两点之间：刚好拼成 AB',a:-2,b:4,start:-4,target:0,task:'把 P 放到 0，观察蓝色 PA 和紫色 PB。',read:'现在 A = −2、B = 4 固定不动，AB = 6。式子 <strong>|x+2|+|x−4|</strong> 就是 PA+PB。当 P 在 A、B 中间，PA 和 PB 首尾相接，刚好拼成 AB。',ask:'P = 0 时，PA+PB 等于多少？',options:['2','6','8'],answer:1,why:'PA=2，PB=4，所以 PA+PB=6。换成路径看：从 A 走到 P，再从 P 走到 B，没有绕路，走的就是整段 AB。',line:'PA + PB = AB = 6',note:'中间：两段拼成一整段。'},
  {title:'中间换个点，总和会变吗？',a:-2,b:4,start:0,target:3,task:'将 P 从 0 移到 3，比较 PA、PB 与总和。',read:'P 向右移动时，PA 变长，PB 同样变短。一段增加多少，另一段就减少多少，总和保持不变。<strong>不只是中点，只要 P 在闭线段 AB 上都成立。</strong>',ask:'哪些位置会使 PA+PB = 6？',options:['只有中点 x = 1','只有 A、B 两个端点','−2 ≤ x ≤ 4 的所有位置'],answer:2,why:'在中间，PA+PB一直等于AB。P=A时是0+6，P=B时是6+0，所以两个端点也包括。若 a≤x≤b，(x−a)+(b−x)=b−a。',line:'a ≤ x ≤ b：S = b−a',note:'“两点之间”在本结论中包含端点。'},
  {title:'P 在左侧：多走了哪一段？',a:-2,b:4,start:0,target:-4,task:'把 P 放到 −4，比较 PB 和 PA+AB。',read:'P 到了 A 的左边。从 P 到 B，必须先经过 A，因此 <strong>PB = PA+AB</strong>。把 PA 再加进去，总和就是 AB 加上两份 PA。这两份，正是跑到线段外面多出的距离。',ask:'P = −4 时，PA+PB = 6+2×多少？',options:['2（P 到 A 的距离）','4（P 的坐标的绝对值）','8（P 到 B 的距离）'],answer:0,why:'PA=2，PB=8，总和10=6+2×2。代数上，x<a 时 PA=a−x、PB=b−x，所以 S=a+b−2x。离 A 越远，总和越大。',line:'左侧：S = AB + 2PA = a+b−2x',note:'外侧多出的路，被算了两次。'},
  {title:'P 在右侧：同样多出两份',a:-2,b:4,start:0,target:6,task:'把 P 放到 6，找出总和比 AB 多出的两段。',read:'P 到了 B 的右边，此时 <strong>PA = AB+PB</strong>。总和变成 AB+2PB。左右外侧都会比 AB 大，只有回到线段 AB 上，多出的路才消失。',ask:'|x+2|+|x−4| 的最小值和取到位置是？',options:['最小值 0，x = 1','最小值 6，−2 ≤ x ≤ 4','最小值 6，只有 x = 1'],answer:1,why:'P=6 时是8+2=10=6+2×2。右侧 x>b 时 S=2x−a−b；中间 S=b−a；左侧 S=a+b−2x。因此最小值是 b−a，在整段 [a,b] 上取到。',line:'右侧：S = AB + 2PB = 2x−a−b',note:'距离和：中间最小且不变，两边向外越来越大。'}],recap:'设 a<b，d=b−a。距离和 S=PA+PB≥d；在线段 [a,b] 上恒等于 d。在线段外，S=d+2×“P 到较近端点的距离”。'},
 {title:'用距离和解决题目',short:'计算距离和',tag:'应用一 · 找点与范围',goal:'把等式、不等式翻译成距离要求，按目标值与 AB 的大小分类。',mode:'sum',steps:[
  {title:'总和等于最小值：一整段解',a:-2,b:4,start:1,target:-2,task:'移动到端点 A，检查端点是否也满足总和为 6。',read:'题目：|x+2|+|x−4|=6。先读出固定点 −2 和 4，得到 AB=6。要求的总和恰好等于 AB，所以 P 必须在线段 AB 上。<strong>答案是一段范围，而不是只有一个数。</strong>',ask:'这道方程的全部解是？',options:['只有 x = −2 或 x = 4','−2 ≤ x ≤ 4','只有 x = 1'],answer:1,why:'整段上的点都满足，包括两端。若目标 k=d，解集就是 a≤x≤b。写答案时用范围，不能只写中点或端点。',line:'k = d ⇒ a ≤ x ≤ b',note:'先比较 k 与两点距离 d。'},
  {title:'总和更大：两侧各找一个点',a:-2,b:4,start:0,target:-4,task:'在 A 的左侧找到总和为 10 的位置。',read:'题目改成总和 10。比 AB=6 多出 4，而线段外的路被计算了两次，所以离较近端点的距离是 <strong>(10−6)÷2=2</strong>。从 A 向左走 2，或从 B 向右走 2。',ask:'总和为 10 的全部位置是？',options:['x = −4 或 x = 6','x = −6 或 x = 8','−4 ≤ x ≤ 6'],answer:0,why:'左边 −2−2=−4；右边 4+2=6。检验分别是2+8和8+2，都为10。若 k>d，令 t=(k−d)/2，解为 x=a−t 或 x=b+t。',line:'先算 t=(k−d)/2，再算 a−t、b+t',note:'只要总和大于最小值，就有左右两个解。'},
  {title:'总和更小：为什么一定无解？',a:-2,b:4,start:6,target:0,task:'将 P 移回线段中间，观察总和能否降到 4。',read:'题目：|x+2|+|x−4|=4。你可以继续试着拖动，但最小总和只能是 6。既然从 A 经 P 到 B 至少要走 AB 这么长，就不可能总共只走 4。',ask:'总和为 4 的方程为什么无解？',options:['因为 x 不能是负数','因为两个绝对值都不能小于 4','因为最小总和是 6，大于 4'],answer:2,why:'不是算不出来，而是几何上不可能。若 k<d，方程无解。不需要再分左右、中间解出不符合范围的数字。',line:'k < d ⇒ 无解',note:'先看最小值，能省去很多无效计算。'},
  {title:'总和不超过 10：把点连成范围',a:-2,b:4,start:0,target:7,task:'把 P 放到 7，看看它为什么不满足“总和≤10”。',read:'等于 10 的边界是 −4 和 6。位于这两个边界之间，总和不超过 10；越过任一边界往外走，总和就大于 10。P=7 时总和12，所以必须排除。',ask:'|x+2|+|x−4| ≤ 10 的解是？',options:['x ≤ −4 或 x ≥ 6','−4 ≤ x ≤ 6','−2 ≤ x ≤ 4'],answer:1,why:'答案是 −4≤x≤6，包含等号对应的两端。若改成 ≥10，则 x≤−4 或 x≥6；改成 >10 则不含两端。特殊地，S≤6 只有 [−2,4]，S≥6 则所有实数都满足。',line:'先找等号边界，再判断“中间”还是“两边”',note:'≤ 取内侧，≥ 取外侧的说法要先确认 k>d；别忘记特殊情形。'}],recap:'S=k：k<d 无解；k=d 一整段 [a,b]；k>d 两个外侧点。解不等式时先找等号边界，再用一个点检验要内侧还是外侧，最后检查端点。'},
 {title:'两段距离，怎样相减',short:'探究距离差',tag:'核心二 · 有顺序的差',goal:'理解 PA−PB 的正负，解释外侧恒定、中间变化的原因。',mode:'diff',steps:[
  {title:'左侧：较短的减较长的',a:-2,b:4,start:0,target:-4,task:'P 放到 −4，按“蓝色 PA 减紫色 PB”的顺序算。',read:'现在研究 <strong>|x+2|−|x−4| = PA−PB</strong>。每一段距离都非负，但两段距离的差可以是负数。P 在左侧时，PB=PA+AB，所以 PA−PB=−AB。',ask:'P = −4 时，PA−PB 等于多少？',options:['6','−6','10'],answer:1,why:'PA=2，PB=8，因此2−8=−6。两段中的公共部分PA抵消后，还剩“减去AB”。只要P在A左侧，这个差始终为−6，与离A多远无关。',line:'x ≤ a：D = −(b−a) = −d',note:'差有先后顺序；它本身不一定是距离。'},
  {title:'到两点一样远，差就是 0',a:-2,b:4,start:-4,target:1,task:'把 P 移到中点 1，比较 PA 和 PB。',read:'从左边向右走，来到两点之间。PA 越来越长，PB 越来越短。到达中点时，两段都是 3，差恰好为 0。差的正负能够告诉我们：P 更靠近哪一个固定点。',ask:'PA−PB = 0 说明什么？',options:['P 到 A、B 的距离相等','P 的坐标一定是 0','P 一定与 A 重合'],answer:0,why:'3−3=0，P到两点一样远。中点坐标是(a+b)/2，这里为(−2+4)/2=1。D<0说明PA<PB，更靠近A；D>0说明更靠近B。',line:'D = 0 ⇒ x = (a+b)/2',note:'距离差为 0，不代表坐标为 0。'},
  {title:'中间向右走 1，差为什么增加 2？',a:-2,b:4,start:1,target:2,task:'把 P 从 1 移到 2，比较两次的 PA−PB。',read:'在 A、B 中间向右移动 1：PA 增加 1，PB 减少 1。原来的差再加 1，又减去一个少了 1 的数，因此一共增加 2。这里 PA=x−a，PB=b−x。',ask:'PA−PB 应怎样去掉括号？',options:['(x−a)−(b−x)=−a−b','(x−a)−(b−x)=2x−a−b','(x−a)−(b−x)=a−b'],answer:1,why:'减去(b−x)时，括号内每一项都变号：x−a−b+x=2x−a−b。这里D=2x−2；x从1变到2，D从0变到2。减号后面的括号一定要整体处理。',line:'a ≤ x ≤ b：D = 2x−a−b',note:'中间：一增一减，差的变化是移动距离的两倍。'},
  {title:'右侧：两段一起长，差不再变',a:-2,b:4,start:2,target:6,task:'把 P 放到 6，观察 PA 比 PB 多多少。',read:'到了 B 右侧，PA=AB+PB。两段继续一起增加，相减时公共部分PB抵消，留下AB。因此左侧差为−6，中间从−6增至6，右侧恒为6。',ask:'PA−PB 的所有可能值是多少？',options:['只有 −6 和 6','任意实数','−6 ≤ PA−PB ≤ 6'],answer:2,why:'右侧8−2=6，最大就是6；左侧最小−6。一般 −d≤D≤d。若交换相减顺序，PB−PA=−D，所有结果变号：左侧为+d，右侧为−d。',line:'x ≥ b：D = b−a = d',note:'距离差：左边 −d，中间递增，右边 +d。'}],recap:'默认 a<b，且 D=|x−a|−|x−b|=PA−PB：左侧 −d；中间 2x−a−b；右侧 +d。−d≤D≤d，交换相减顺序后整体变号。'},
 {title:'用距离差解决题目',short:'计算距离差',tag:'终关 · 分类与检验',goal:'按目标值与 ±AB 的关系分类，区分一个点、一条射线和无解。',mode:'diff',steps:[
  {title:'差在两端值之间：只有一个点',a:-2,b:4,start:0,target:2,task:'找到 PA−PB = 2 的位置，观察 P 落在哪一区域。',read:'题目：|x+2|−|x−4|=2。左侧只能得到−6，右侧只能得到6，因此差为2的点只能在中间。中间D=2x−2，所以2x−2=2，解得x=2。',ask:'为什么 x = 2 是唯一解？',options:['因为绝对值方程只能有一个解','因为外侧不取 2，中间的差一直增大，只经过 2 一次','因为 P 只能取正数'],answer:1,why:'−6<2<6，所以只用中间公式。一般当−d<k<d时，2x−a−b=k，得到x=(k+a+b)/2；再检查它确实在(a,b)内。',line:'−d < k < d ⇒ x = (k+a+b)/2',note:'这里的答案是一个点，不是两个对称点。'},
  {title:'差等于 −6：左边整条射线',a:-2,b:4,start:2,target:-5,task:'把 P 放到 −5，看看差是否仍为 −6。',read:'题目改成D=−6。P=−2时满足；继续向左，PA、PB同时增加，相减还是−6。所以不能只写x=−2。所有不超过−2的位置都满足。',ask:'|x+2|−|x−4| = −6 的全部解是？',options:['只有 x = −2','x ≤ −2','x ≥ 4'],answer:1,why:'在左侧D一直等于−d，包括端点A。只用中间公式会得到边界−2，却漏掉整个左侧。要先辨认k=−d这个特殊情况。',line:'k = −d ⇒ x ≤ a',note:'等于最小差：向左的一整条射线，端点要包含。'},
  {title:'差等于 +6：右边整条射线',a:-2,b:4,start:2,target:6,task:'让 P 到 6，检查它是否与端点 B 一样满足条件。',read:'题目改成D=6。P=B时PA=6、PB=0；P移到B右侧，PA始终比PB多6。所有不小于4的点都满足。',ask:'|x+2|−|x−4| = 6 的全部解是？',options:['只有 x = 4','x ≤ −2','x ≥ 4'],answer:2,why:'右侧D恒为+d，包括B。k=d时解为x≥b。记住这里减法的顺序是PA−PB；若顺序反过来，左右射线也会交换。',line:'k = d ⇒ x ≥ b',note:'等于最大差：向右的一整条射线，端点要包含。'},
  {title:'超出范围无解；不等式看方向',a:-2,b:4,start:4,target:8,task:'把 P 继续向右移到 8，看差能不能达到 8。',read:'P走得再远，差也不超过6。因此D=8无解。再看D≥2：等于2的边界是x=2，中间的差向右增大，右侧恒为6也满足，所以解为x≥2。',ask:'|x+2|−|x−4| ≥ 2 的解是？',options:['x ≥ 2','x ≤ 2','只有 x = 2'],answer:0,why:'D=8无解，因为|8|>6。D≥2则从边界2向右取整条射线，端点包括。若D>2，不包括2；若D≤2，改为x≤2。先确定差的顺序，再看它怎样变化。',line:'|k| > d：无解；中间找边界，再判断方向',note:'不要把“距离和”的两个外侧点，套到“距离差”上。'}],recap:'D=k：|k|>d 无解；k=−d 时 x≤a；−d<k<d 时 x=(k+a+b)/2；k=d 时 x≥b。所有结论默认 a<b、先 PA 再减 PB。'}
];

function makeQuestions(unit, round) {
 let seed=(unit+1)*193+round*7919; const rand=n=>{seed=(seed*1664525+1013904223)>>>0;return seed%n};
 const n=2+rand(6), a=-1-rand(4), d=4+2*rand(3), b=a+d, t=1+rand(3), m=(a+b)/2;
 const abs=(anchor)=>anchor<0?`|x+${-anchor}|`:anchor===0?'|x|':`|x−${anchor}|`;
 const S=`${abs(a)}+${abs(b)}`,D=`${abs(a)}−${abs(b)}`;
 const range=(l,r)=>`${l} ≤ x ≤ ${r}`, pair=(l,r)=>`x = ${l} 或 x = ${r}`;
 const q=(prompt,correct,others,explain,review=0)=>({prompt,correct,options:[correct,...others].map((text,i)=>({text,k:rand(100000)+i})).sort((p,q)=>p.k-q.k).map(p=>p.text),explain,review});
 const all=[
 ()=>[
 q(`点 P 的坐标是 −${n}。P 到原点的距离是多少？`,`${n}`,[`−${n}`,'0',`${2*n}`],`距离非负。|−${n}|=${n}，负号表示点在原点左侧。`),
 q(`|x| = ${n+1} 的全部解是？`,pair(-n-1,n+1),[`只有 x = ${n+1}`,`只有 x = ${-n-1}`,range(-n-1,n+1)],`以0为中心向左右各走${n+1}，得到两个位置。`,3),
 q('当 |x| = 0 时，x 应该是多少？','x = 0',['任意实数','无解','x = 1 或 x = −1'],'只有点与原点重合时，到原点的距离才是0。',2),
 q(`|x| = −${n} 有什么解？`,'无解',[`x = −${n}`,`x = ${n}`,pair(-n,n)],'距离不可能是负数，因此无解。',2),
 q(`比较 |−${n+2}| 和 |${n+2}|。`,'两者相等',['前者更大','后者更大','无法比较'],`两点在原点两侧，离原点都是${n+2}个单位。`,1)],
 ()=>[
 q(`式子 |x+${n}| 表示 P = x 到哪个固定点的距离？`,`A = −${n}`,[`A = ${n}`,'原点 O = 0',`A = ${n+1}`],`|x+${n}|=|x−(−${n})|，固定点坐标为−${n}。`,2),
 q(`A = ${a}、B = ${b} 的距离 AB 是多少？`,`${d}`,[`${d+2}`,`${-d}`,`${d-1}`],`AB=|${b}−(${a})|=${d}。两个坐标作差，再取绝对值。`,3),
 q(`|x−${n+2}| = 2 的全部解是？`,pair(n,n+4),[pair(-2,2),`只有 x = ${n+4}`,range(n,n+4)],`中心${n+2}，向左走2到${n}，向右走2到${n+4}。`,1),
 q(`A = ${n}、B = ${n+3} 都在原点右侧。AB 等于多少？`,'3',[`${2*n+3}`,'−3',`${n+3}`],`AB=|${n+3}−${n}|=3，不能把到原点的两段距离相加。`,3),
 q('坐标为 x 的点 P 到坐标为 a 的点 A 的距离 PA 可以表示为？','|x−a|',['x−a（不取绝对值）','|x|+|a|','|x+a|'],'任意两点距离是坐标之差的绝对值，|x−a|=|a−x|。',0)],
 ()=>[
 q(`A = ${a}、B = ${b}，PA+PB 的最小值是多少？`,`${d}`,['0',`${d+2}`,`${2*d}`],`最小值是AB=b−a=${d}，在整段AB上取到。`,3),
 q(`P 位于 A = ${a} 和 B = ${b} 之间且不与端点重合。PA+PB 等于？`,`${d}`,[`${d+1}`,`${2*d}`,'不能确定'],`PA和PB首尾相接，恰好拼成AB，因此总和恒为${d}。`,1),
 q(`A = ${a}、B = ${b}，P 在 A 左侧 ${t} 个单位处。PA+PB 是多少？`,`${d+2*t}`,[`${d+t}`,`${d}`,`${t}`],`左侧PB=PA+AB，总和=AB+2PA=${d}+2×${t}=${d+2*t}。`,2),
 q(`A = ${a}、B = ${b}，P 在 B 右侧 ${t+1} 个单位处。PA+PB 是多少？`,`${d+2*(t+1)}`,[`${d+t+1}`,`${d}`,`${d-1}`],`右侧PA=AB+PB，总和=AB+2PB=${d}+2×${t+1}。`,3),
 q(`哪些 x 会让 ${S} 取最小值？`,range(a,b),[`只有 x = ${m}`,pair(a,b),'所有实数'],`线段AB上的每一点都使总和等于AB，包含两个端点。`,1)],
 ()=>[
 q(`${S} = ${d-2} 的解是？`,'无解',[pair(a-1,b+1),range(a,b),`x = ${m}`],`两定点距离d=${d}，目标${d-2}<d，达不到最小值，所以无解。`,2),
 q(`${S} = ${d} 的全部解是？`,range(a,b),[pair(a,b),`只有 x = ${m}`,'无解'],`目标等于两定点距离，整段[a,b]都是解。`,0),
 q(`${S} = ${d+2*t} 的全部解是？`,pair(a-t,b+t),[pair(a-2*t,b+2*t),range(a-t,b+t),pair(a,b)],`超出AB的总路程是${2*t}，除以2得${t}，所以x=${a}−${t}=${a-t}或${b}+${t}=${b+t}。`,1),
 q(`${S} ≤ ${d+2*t} 的解是？`,range(a-t,b+t),[`x ≤ ${a-t} 或 x ≥ ${b+t}`,range(a,b),pair(a-t,b+t)],`等号边界为${a-t}、${b+t}，总和不超过目标取边界之间，包含两端。`,3),
 q(`${S} ≥ ${d+2*t} 的解是？`,`x ≤ ${a-t} 或 x ≥ ${b+t}`,[range(a-t,b+t),`x ≥ ${a-t}`,`x ≤ ${b+t}`],`目标大于最小值，等号边界为${a-t}、${b+t}。往外总和增大，取两侧并包含端点。`,3)],
 ()=>[
 q(`A = ${a}、B = ${b}，P 在 A 左侧。PA−PB 等于？`,`${-d}`,[`${d}`,'0','随 P 变化'],`左侧PB=PA+AB，PA−PB=−AB=${-d}。`,0),
 q(`A = ${a}、B = ${b}，P 在 B 右侧。PA−PB 等于？`,`${d}`,[`${-d}`,'0','随 P 变化'],`右侧PA=AB+PB，相减剩下AB=${d}。`,3),
 q(`A = ${a}、B = ${b}，PA−PB = 0 时 x 等于？`,`${m}`,[`${m+1}`,`${a}`,`${b}`],`两段距离相等，P在中点，x=(${a}+${b})/2=${m}。`,1),
 q('P 在 A = a、B = b 中间（a<b），PA−PB 的表达式是？','2x−a−b',['b−a','a−b','−a−b'],'(x−a)−(b−x)=x−a−b+x=2x−a−b，减号后括号内各项都变号。',2),
 q(`已知 PA−PB = ${n}，那么 PB−PA 等于？`,`${-n}`,[`${n}`,'0',`${2*n}`],'交换减法顺序，结果整体变号。距离差可以为负数。',3)],
 ()=>[
 q(`${D} = 2 的解是？`,`x = ${m+1}`,[`x = ${m-1}`,`x ≥ ${b}`,`x ≤ ${a}`],`−${d}<2<${d}，只有中间有解：x=(2+${a}+${b})/2=${m+1}。`,0),
 q(`${D} = ${-d} 的全部解是？`,`x ≤ ${a}`,[`只有 x = ${a}`,`x ≥ ${b}`,range(a,b)],`目标等于−d，左侧整条射线都满足，包括A。不能只取边界。`,1),
 q(`${D} = ${d} 的全部解是？`,`x ≥ ${b}`,[`只有 x = ${b}`,`x ≤ ${a}`,range(a,b)],`目标等于+d，右侧整条射线都满足，包括B。`,2),
 q(`${D} = ${d+2} 的解是？`,'无解',[`x = ${b+1}`,`x ≥ ${b}`,pair(a,b)],`差的范围是[−${d},${d}]，目标${d+2}超出范围。不能在外侧使用中间公式。`,3),
 q(`${D} ≥ 2 的解是？`,`x ≥ ${m+1}`,[`x ≤ ${m+1}`,`只有 x = ${m+1}`,`x ≥ ${b}`],`等号边界x=${m+1}。PA−PB从左向右不减，小于边界不满足，边界及其右侧都满足。`,3)]
 ];
 return all[unit]();
}

const COPY = new Map();
const copyKey=s=>String(s).replace(/\s+/g,' ').trim();
function addCopy(zh,en){COPY.set(copyKey(zh),en);if(/[\u3400-\u9fff]/.test(zh)&&zh.includes('<strong>')){const t=document.createElement('div');t.innerHTML=zh;COPY.set(copyKey(t.textContent),en)}}
const UNIT_EN=[
 ['From coordinates to distances','Meet |x|','Start · Distance to zero','Tell “which side?” apart from “how far?” and explain |x| as a distance.','Absolute value tells us a distance: |x| is the distance from point P at x to O = 0, so it cannot be negative. For |x|=r, check whether r is positive, zero or negative.'],
 ['Move the centre away from zero','Understand |x−a|','Next · Distance between two points','Read |x−a| as the distance from point P at x to point A at a, and write the distance between any two points.','PA=|x−a| is the distance from point P at x to point A at a. AB=|b−a| is the distance between A = a and B = b. Subtract the coordinates first, then take the absolute value.'],
 ['What happens when distances add?','Explore distance sums','Core idea 1 · Adding distances','Explain what changes when P is to the left, between the points or to the right.','Assume a<b and d=b−a. The sum S=PA+PB is at least d, and equals d everywhere on [a,b]. Outside the segment, S=d+2×the distance to the nearer endpoint.'],
 ['Let the distance sum solve it','Solve distance-sum problems','Apply it 1 · Points and intervals','Turn equations and inequalities into distance questions, then compare the target with AB.','For S=k: if k<d, there is no solution; if k=d, the whole segment [a,b] works; if k>d, two outside points work. For an inequality, find the boundary points, test the regions and check whether the endpoints count.'],
 ['What happens when distances subtract?','Explore distance differences','Core idea 2 · Order matters','Understand positive and negative differences, and explain why the value is constant outside but changes between the points.','Assume a<b and D=|x−a|−|x−b|=PA−PB. To the left, D=−d; between the points, D=2x−a−b; to the right, D=d. Always −d≤D≤d. Reversing the subtraction reverses the sign.'],
 ['Let the distance difference solve it','Solve distance-difference problems','Final stage · Cases and checks','Use the target and ±AB to decide whether the solution is one point, a ray or nothing at all.','For D=k: |k|>d gives no solution; k=−d gives x≤a; −d<k<d gives x=(k+a+b)/2; k=d gives x≥b. These rules assume a<b and the order PA−PB.']
];
UNITS.forEach((u,i)=>['title','short','tag','goal','recap'].forEach((key,j)=>addCopy(u[key],UNIT_EN[i][j])));
function lessonCopy(i,j,c){const s=UNITS[i].steps[j];for(const key of ['title','read','why']){s[key]=c[key][0];addCopy(s[key],c[key][1])}for(const key of ['task','ask','line','note'])addCopy(s[key],c[key]);s.options.forEach((o,k)=>addCopy(o,c.options[k]))}
lessonCopy(0,0,{
 title:['负号指路，绝对值量距离','The minus sign points; absolute value measures'],
 read:['先把点 P 移到 −3。它站在原点左边，可从 0 走到它，还是要走 3 个单位。负号像个方向牌，只负责说“往左”；绝对值像把小尺子，只管量你离原点多远。<strong>站在负数的位置，可不等于走了“负的距离”！</strong>','Move point P to −3. It is to the left of zero, but getting there still takes 3 units. Think of the minus sign as a direction sign and absolute value as a little ruler measuring your distance from zero. <strong>A negative coordinate does not mean a negative distance!</strong>'],
 why:['对，就是 3！从 −3 回到 0，要走 3 个单位，所以 |−3|=3。你可以把“−3”读成“往左 3”，把“|−3|”读成“离原点 3”。注意区分：负号表示方向，绝对值表示距离。','Yes—3! Getting from −3 to 0 takes 3 units, so |−3|=3. Read −3 as “3 to the left” and |−3| as “3 units from zero”. Keep direction and distance separate.'],
 task:'Drag P to −3. How far is it from the origin O?',ask:'P has coordinate −3. What is its distance from the origin?',options:['−3','3','0'],line:'|−3| = 3',note:'|x| is the distance from the point with coordinate x to the origin.'
});
lessonCopy(0,1,{
 title:['换到右边，距离一样吗？','Other side, same distance?'],
 read:['刚才 P 在 −3，现在把它移到右边的 3。一路看着距离：先变小，到 0，再变大。到了 3，你会发现小尺子又量出“3”！<strong>原点两边的两个点，完全可以离它一样远。</strong>绝对值只看距离，不问你从哪边来。','P was at −3. Now move it to 3 on the right. Watch the distance shrink to 0, then grow again. At 3, the ruler measures 3 units again! <strong>Two points on opposite sides of zero can be equally far away.</strong> Absolute value measures how far, not which side.'],
 why:['这两个点关于原点对称：|−3|=|3|=3。所以有人说“离原点 3”，你要多问一句：“左边还是右边？”若题目没限制，两边都得找，不能漏掉一个。','These points are symmetric about zero: |−3|=|3|=3. So “3 units from zero” leaves one question: left or right? Unless the question restricts the side, both positions count.'],
 task:'Move P from −3 to 3 and compare the two distances.',ask:'How do the distances from −3 and 3 to the origin compare?',options:['−3 is farther away','3 is farther away','They are equal: both are 3'],line:'|x| = 3 ⇒ x = −3 or x = 3',note:'When a positive distance is given, check both sides of the origin.'
});
lessonCopy(0,2,{
 title:['回到原点，距离变成 0','At the origin, the distance is zero'],
 read:['把 P 移回原点，让它与 O 重合。中间一段路都没有，距离当然是 0。再往左拖，距离又会变大，可不会掉进负数里。<strong>距离的底线是 0，不能再低了。</strong>这和坐标能不能是负数，是两回事。','Move P back to the origin so that P and O coincide. There is no gap left, so the distance is 0. Drag farther left and the distance grows again—it never dips below zero. <strong>Zero is the smallest possible distance.</strong> Coordinates, unlike distances, can be negative.'],
 why:['没错，0 也算！“非负”就是“大于或等于 0”，也包括 0。|x|=0 只有 x=0；要是题目让 |x|=−2，就没有解，因为距离不可能是负数。','Exactly—zero is allowed! “Non-negative” means greater than or equal to zero. So |x|=0 only when x=0. But |x|=−2 has no solution: a distance simply cannot do that.'],
 task:'Drag P to the origin so that P and O occupy the same position.',ask:'Which statement is correct?',options:['|x| can equal −2','|x| ≥ 0, with equality only when x = 0','|x| is always greater than 0'],line:'|x| ≥ 0; |x| = 0 ⇔ x = 0',note:'A distance cannot be negative. Zero is allowed.'
});
lessonCopy(0,3,{
 title:['别急着算，先在数轴上找点','Before calculating, locate the points'],
 read:['看到 |x|=4，先别急着用公式。可以这样读：“谁离原点 4 个单位？”向左找一找，向右也找一找。这道方程就是要你在数轴上找到这些点。<strong>你要交出的答案，是所有符合距离要求的位置。</strong>','See |x|=4? No need to reach for a formula yet. Read it as “Which points are 4 units from zero?” Look left, then right. The equation asks you to locate those points on the number line. <strong>Your answer must include every position that fits.</strong>'],
 why:['左边找到 −4，右边还有 4，别把它落下。把这个办法带走：r>0 时，|x|=r 有两个解 ±r；r=0 时，两边“合并”到原点，只剩一个解；r<0 时，距离不可能是负数，所以无解。','You found −4 on the left, and 4 on the right. Keep this pattern: for r>0, |x|=r has two solutions, ±r. At r=0 they meet at the origin, giving one solution. For r<0 there is no solution.'],
 task:'First find the point 4 units to the left of the origin.',ask:'What are all the solutions of |x| = 4?',options:['Only x = 4','Only x = −4','x = −4 or x = 4'],line:'Read the distance → locate centre 0 → check both sides',note:'Think in distances first. There is no need to memorise sign rules yet.'
});
lessonCopy(1,0,{
 title:['这次不回原点，去找 A','This time, measure from A'],
 read:['小尺子换个起点：这次不量 P 到 0，而是量它到 A = 3。P 在 1，A 在 3，隔着 2 个单位。用坐标一减，1−3=−2；再套上绝对值，就得到距离 2。<strong>注意，这次的中心是 3，不再是原点。</strong>','Time to move the starting point of our ruler. We now measure from P to A = 3, not to zero. With P at 1, the gap is 2 units. Subtracting gives 1−3=−2; taking the absolute value gives the distance 2. <strong>The centre has moved to 3!</strong>'],
 why:['这里关键是找准固定点。|x−3| 对照 |x−a|，a 就是 3，所以它量的是 PA。里面的减号负责把两个坐标作差，不能把这个减号直接当成固定点坐标的负号。固定点是 3，不是 −3。','The key is to identify the fixed point. Compare |x−3| with |x−a|: a is 3, so the expression measures PA. The subtraction sign tells us to subtract coordinates; it does not turn the fixed point into −3. A has coordinate 3.'],
 task:'A stays at 3. Drag P to 1 and measure PA.',ask:'Which distance does |x−3| represent?',options:['From P = x to A = 3','From P = x to A = −3','From P = x to the origin'],line:'PA = |x−a|; here a = 3',note:'Identify the fixed point a first, then the moving point x.'
});
lessonCopy(1,1,{
 title:['以 3 为中心，两边各走 2','Two units each way from 3'],
 read:['刚才你在 1 找到一个答案：离 3 正好是 2。再看看 A 的右边，还有没有符合条件的点？从 3 向右走 2，就到了 5。<strong>|x−3|=2 的意思，是围着 3 找距离为 2 的点。</strong>注意，这次的两个解不是 −2 和 2。','You found one answer at 1, which is 2 units from 3. Now check the right side of A for another solution. Start at 3 and move 2 right to reach 5. <strong>|x−3|=2 asks for points 2 units from 3.</strong> The answers are not −2 and 2 this time.'],
 why:['两个位置分别是：3−2=1，3+2=5。一般地，r>0 时，|x−a|=r 的解是 a−r 和 a+r；r=0 时只剩 a；r<0 时无解。别只记“左右各走”，还要记住“从哪里出发”。','The two positions are: 3−2=1 and 3+2=5. In general, when r>0, |x−a|=r gives x=a−r or a+r. When r=0, only x=a works; when r<0, nothing works. Remember where the journey starts!'],
 task:'P = 1 gave PA = 2. Find the other position, to the right of A.',ask:'What are all the solutions of |x−3| = 2?',options:['x = −2 or x = 2','x = 1 or x = 5','Only x = 5'],line:'Start at a; move r units left and r units right',note:'Keep the centre a in mind. The answers are usually not ±r.'
});
lessonCopy(1,2,{
 title:['里面是加号，固定点怎么找？','How do we find the fixed point with a plus sign?'],
 read:['|x+2| 好像和刚才长得不太一样？先把加法改写成减法：<strong>|x+2|=|x−(−2)|</strong>。现在看清了吧，a=−2。它量的是 P 到 −2 的距离，不是到 2。先写成 |x−a| 的形式，就不容易认错固定点。','Does |x+2| look different? Rewrite the addition as subtraction: <strong>|x+2|=|x−(−2)|</strong>. Now a=−2 is easy to spot. We measure from P to −2, not to 2. Writing it as |x−a| makes the fixed point easier to identify.'],
 why:['从 −2 到 3，一共 5 个单位，所以 |3+2|=5。以后碰到加号，就把它改写成“减去一个负数”。这样就能看清 |x−a| 里的 a 是多少。','From −2 to 3 is 5 units, so |3+2|=5. When you see a plus sign, rewrite it as subtracting a negative. This makes the value of a in |x−a| clear.'],
 task:'A stays at −2. Drag P to 3 and observe PA.',ask:'When P = 3, what is |x+2|?',options:['1','−5','5'],line:'|x+2| = |x−(−2)| = PA',note:'“Plus 2” means the fixed point is −2; “minus 3” means it is 3.'
});
lessonCopy(1,3,{
 title:['两点量距离，一招通用','One distance rule for any two points'],
 read:['让 P 走到 B = 4，这时 PA 就成了 AB。其实不管两点在哪儿，量距离都用同一招：<strong>AB=|b−a|=|a−b|</strong>。先把坐标作差，再取绝对值。先减谁都行，取绝对值后，得到的距离相同，而且不会是负数。','Move P onto B = 4. Now PA is exactly AB. Wherever the two points are, the same rule works: <strong>AB=|b−a|=|a−b|</strong>. Subtract the coordinates, then take the absolute value. Either subtraction order gives the same non-negative distance.'],
 why:['4−(−2)=6，这两个点隔着 6 个单位。小心一个“看起来很顺手”的坑：别总把两点到原点的距离相加！比如 2 和 5 隔着 3，不是 |2|+|5|=7。通用办法还是：坐标作差，再取绝对值。','Here 4−(−2)=6, so the points are 6 units apart. Watch out for a tempting shortcut: adding their distances to zero does not always work. Points 2 and 5 are 3 units apart, not |2|+|5|=7. Subtract coordinates, then take the absolute value.'],
 task:'Move P onto B = 4. PA is now the distance AB.',ask:'What is the distance between A = −2 and B = 4?',options:['|4−(−2)| = 6','|4+(−2)| = 2','−2−4 = −6'],line:'AB = |b−a|; if a < b, then AB = b−a',note:'Distance between two points = absolute value of the difference of their coordinates.'
});
lessonCopy(2,0,{
 title:['两段路，刚好拼成一段','Two pieces make one whole'],
 read:['现在把 A 点固定在 −2，B 点固定在 4，再把 P 放在两点之间。式子 <strong>|x+2|+|x−4|</strong>，说白了就是“PA 这段路，加上 PB 这段路”。当 P 在中间，两段首尾相接，刚好就是 AB！没有绕路，也没有多走一步。','Fix point A at −2 and point B at 4, then place P between them. The expression <strong>|x+2|+|x−4|</strong> means “the length PA plus the length PB”. With P between A and B, those pieces fit together to make AB. No detour, no extra distance.'],
 why:['P=0 时，PA=2、PB=4，总和是 6。你也可以用手指从 A 沿着数轴走到 P，再走到 B：这趟路就是 AB。把数字换成点的位置，式子就没那么神秘了。','At P=0, PA=2 and PB=4, so the sum is 6. Trace from A to P and then to B with your finger: you have travelled exactly AB. The symbols make more sense once you can see the route.'],
 task:'Put P at 0 and compare the blue PA segment with the purple PB segment.',ask:'When P = 0, what is PA+PB?',options:['2','6','8'],line:'PA + PB = AB = 6',note:'Between the endpoints, the two distances join to make AB.'
});
lessonCopy(2,1,{
 title:['一边变长，另一边缩短','One grows; the other shrinks'],
 read:['试着把 P 从 0 推到 3。PA 变长了，PB 却刚好缩短同样多，像在交接一根绳子：你多拿一点，我少拿一点，总长度没变。<strong>不是只有中点满足这个关系，整段 AB 上都行，端点也算。</strong>','Push P from 0 to 3. PA grows, while PB shrinks by exactly the same amount. Imagine sharing one rope: a little more for you, a little less for me, but the total stays fixed. <strong>Every point on AB works, not just the midpoint—and the endpoints count too.</strong>'],
 why:['P=3 时是 5+1=6。P 到 A，是 0+6；P 到 B，是 6+0。总和一直是 6。写成通用算式：a≤x≤b 时，(x−a)+(b−x)=b−a，两个 x 正好抵消。','At P=3, the sum is 5+1=6. At A it is 0+6; at B it is 6+0. Always 6! In symbols, when a≤x≤b, (x−a)+(b−x)=b−a: the two x terms cancel.'],
 task:'Move P from 0 to 3. Watch PA, PB and their sum.',ask:'Which positions make PA+PB = 6?',options:['Only the midpoint x = 1','Only the two endpoints A and B','Every position with −2 ≤ x ≤ 4'],line:'a ≤ x ≤ b: S = b−a',note:'This result includes both endpoints.'
});
lessonCopy(2,2,{
 title:['移到左侧，哪段路被算了两次？','To the left: which bit gets counted twice?'],
 read:['把 P 移到 A 的左边。这时从 P 去 B，得先经过 A，所以 <strong>PB=PA+AB</strong>。再把另一份 PA 加进来，就成了 AB+2PA。注意，P 到 A 的这段距离，在总和里被算了两次。','Move P to the left of A. To get from P to B, you pass A first, so <strong>PB=PA+AB</strong>. Add the other PA and you get AB+2PA. That extra stretch outside AB appears twice in the total.'],
 why:['P=−4 时，PA=2、PB=8，总和 10=6+2×2。超出的 4，可不是 P 离 A 有 4，而是那段长为 2 的路被算了两次。一般 x<a 时，S=(a−x)+(b−x)=a+b−2x。','At P=−4, PA=2 and PB=8, so the sum is 10=6+2×2. The extra 4 does not mean P is 4 units from A: it is a 2-unit stretch counted twice. For x<a, S=(a−x)+(b−x)=a+b−2x.'],
 task:'Put P at −4. Compare PB with PA+AB.',ask:'When P = −4, PA+PB = 6 + 2 × what?',options:['2: the distance from P to A','4: the absolute value of P’s coordinate','8: the distance from P to B'],line:'Left of A: S = AB + 2PA = a+b−2x',note:'Outside AB, the extra stretch is counted twice.'
});
lessonCopy(2,3,{
 title:['换到右侧，关系有什么变化？','To the right: how does the relationship change?'],
 read:['再把 P 移到 B 的右边。这次是 <strong>PA=AB+PB</strong>，所以总和等于 AB+2PB。左右两边都一样：P 在线段外时，总和会多出两份到较近端点的距离。想让总和最小，只要把 P 移回线段 AB 上。','Move P to the right of B. Now <strong>PA=AB+PB</strong>, so the total is AB+2PB. Either side tells the same story: outside the segment, the extra stretch counts twice. To get the smallest total, bring P back onto AB. There is then no extra stretch to add.'],
 why:['P=6 时，8+2=10=6+2×2。右侧 x>b 时，S=2x−a−b；左侧是 a+b−2x；中间一直是 b−a。所以最小值是 b−a，而且整段 [a,b] 都能取到，不只是中点能取到。','At P=6, 8+2=10=6+2×2. For x>b, S=2x−a−b; on the left, S=a+b−2x; between the points, S=b−a. The minimum is b−a, reached everywhere on [a,b]. It is not restricted to the midpoint.'],
 task:'Put P at 6. Find the two extra stretches beyond AB.',ask:'What is the minimum of |x+2|+|x−4|, and where is it reached?',options:['Minimum 0, at x = 1','Minimum 6, for −2 ≤ x ≤ 4','Minimum 6, only at x = 1'],line:'Right of B: S = AB + 2PB = 2x−a−b',note:'Distance sum: smallest and constant between the points, increasing outwards on either side.'
});
lessonCopy(3,0,{
 title:['这次的答案，是一整段范围','The solution is a whole interval'],
 read:['先看这道题：|x+2|+|x−4|=6。先找出固定点 −2 和 4，算出 AB=6。目标也正好是 6，不就是刚才的最小总和吗？<strong>整段 AB 上的点都满足条件。</strong>别只交一个中点，也别只挑两个端点，中间的其他点也都要包括。','Consider this equation: |x+2|+|x−4|=6. Find the fixed points −2 and 4, so AB=6. The target is exactly that minimum sum. <strong>Every point on AB satisfies the condition.</strong> Do not hand in just the midpoint or the two endpoints—the other points count too!'],
 why:['从 −2 一直到 4，每个位置都行，两个端点也包括。所以答案是 −2≤x≤4。一般 k=d 时，解为 a≤x≤b。题目叫“方程”，可没保证答案一定只有一两个数。','Every position from −2 to 4 works, including both endpoints. So −2≤x≤4. In general, k=d gives a≤x≤b. An equation does not promise just one or two answers!'],
 task:'Move P onto A and check whether the endpoint also gives a sum of 6.',ask:'What is the complete solution set?',options:['Only x = −2 or x = 4','−2 ≤ x ≤ 4','Only x = 1'],line:'k = d ⇒ a ≤ x ≤ b',note:'First compare the target k with the distance d between the fixed points.'
});
lessonCopy(3,1,{
 title:['多出来的路程，记得除以 2','Extra distance? Remember to halve it'],
 read:['这次总和要 10，比 AB=6 多了 4。回忆一下：外面的路会算两次！所以 P 离较近端点其实只有 <strong>(10−6)÷2=2</strong>。从 A 向左走 2，或者从 B 向右走 2，就找到了两个解。','Now the sum must be 10, which is 4 more than AB=6. Remember: the outside stretch counts twice! So P is only <strong>(10−6)÷2=2</strong> units from the nearer endpoint. Move 2 left from A or 2 right from B to find both answers.'],
 why:['左边 −2−2=−4，右边 4+2=6。代回去，分别是 2+8 和 8+2，都为 10。一般 k>d 时，先算 t=(k−d)/2，再找 a−t 和 b+t。忘记除以 2，就会把线段外的距离算大一倍。','On the left, −2−2=−4; on the right, 4+2=6. Checking gives 2+8 and 8+2, both 10. For k>d, calculate t=(k−d)/2, then find a−t and b+t. Without halving, the outside distance would be twice as large as it should be.'],
 task:'Find the position to the left of A where the sum is 10.',ask:'What are all the positions with a distance sum of 10?',options:['x = −4 or x = 6','x = −6 or x = 8','−4 ≤ x ≤ 6'],line:'Find t=(k−d)/2, then a−t and b+t',note:'A target above the minimum gives two solutions, one on each outside region.'
});
lessonCopy(3,2,{
 title:['总和能小于两点之间的距离吗？','Can the sum be smaller than the distance between the fixed points?'],
 read:['现在要求 |x+2|+|x−4|=4。你可以拖一拖，试着把总和压低。但 AB 已经有 6 个单位长了，从 A 经 P 到 B，怎么也得走这么远。<strong>目标比最小值还小，没有任何点能满足要求。</strong>','Now try |x+2|+|x−4|=4. Drag P and see how small you can make the sum. AB is already 6 units long, so travelling from A through P to B cannot take just 4. <strong>The target is below the minimum: no point qualifies.</strong>'],
 why:['“无解”也是一个明确的答案，不是你算不出来。这里最小总和 6>4，所以无解。一般 k<d 时直接排除，不用再分三段逐一计算。','“No solution” is a proper answer, not a failure to calculate. The minimum is 6, which is greater than 4. Whenever k<d, rule it out straight away; there is no need to solve three separate cases first.'],
 task:'Bring P back between A and B. Can the sum drop to 4?',ask:'Why does the equation with a sum of 4 have no solution?',options:['Because x cannot be negative','Because neither absolute value can be less than 4','Because the minimum sum is 6, which is greater than 4'],line:'k < d ⇒ no solution',note:'Check the minimum first and save yourself unnecessary calculation.'
});
lessonCopy(3,3,{
 title:['先找等号边界，再判断范围','Equality finds the boundary; inequality picks the region'],
 read:['刚才总和等于 10 的两个位置是 −4 和 6。现在把“等于”换成“不超过”：P 在两道边界之间时满足要求，移到外侧，总和就会超过 10。把 P 移到 7 看看：读数是 12，所以这个位置不符合条件。','We found two positions where the sum equals 10: −4 and 6. Now change “equals” to “at most”. P may stay anywhere between those boundaries; outside, the sum goes over the limit. Try P=7: the sum is 12, so that point is out.'],
 why:['S≤10 取 −4≤x≤6，两端正好等于 10，当然算。若改成 S≥10，就选 x≤−4 或 x≥6；若是 S>10，两端不算。还要看特殊情况：S≤6 只取 [−2,4]，S≥6 则所有实数都行。','S≤10 gives −4≤x≤6. The endpoints equal 10, so they count. For S≥10, choose x≤−4 or x≥6. For S>10, leave the endpoints out. Special case: S≤6 gives only [−2,4], while S≥6 allows every real number.'],
 task:'Put P at 7. Why does it fail the condition “sum ≤ 10”?',ask:'What is the solution of |x+2|+|x−4| ≤ 10?',options:['x ≤ −4 or x ≥ 6','−4 ≤ x ≤ 6','−2 ≤ x ≤ 4'],line:'Find the equality boundaries, then choose inside or outside',note:'“≤ means inside, ≥ means outside” needs k>d. Check the special cases too.'
});
lessonCopy(4,0,{
 title:['距离不为负，减完可不一定','Distances are non-negative; their difference may not be'],
 read:['现在来看两段距离相减：<strong>|x+2|−|x−4|=PA−PB</strong>。注意顺序，是蓝色减紫色！每段距离都不小于 0，可“短的减长的”当然会是负数。就像比分 2 比 8，你用 2−8 表示差距，得到 −6，一点也不奇怪。','Now subtract the two distances: <strong>|x+2|−|x−4|=PA−PB</strong>. Keep the order: blue minus purple! Each distance is non-negative, but a shorter distance minus a longer one is negative. Like scores of 2 and 8: the difference 2−8 is −6. Nothing strange there.'],
 why:['P=−4 时，2−8=−6。左侧 PB=PA+AB，两段共有的 PA 抵消后，还剩“减去 AB”。因此 不管 P 在 A 左边多远，差一直是 −6。这回不是路程总和，别一顺手又给加起来了。','At P=−4, 2−8=−6. On the left, PB=PA+AB. The shared PA cancels, leaving −AB. However far P moves to the left, the difference stays −6. We are subtracting distances now, not adding them.'],
 task:'Put P at −4 and calculate blue PA minus purple PB, in that order.',ask:'When P = −4, what is PA−PB?',options:['6','−6','10'],line:'x ≤ a: D = −(b−a) = −d',note:'A difference has an order. It is not necessarily a distance itself.'
});
lessonCopy(4,1,{
 title:['两边打平，差就归零','A tie means a difference of zero'],
 read:['把 P 往右拖。进了 A、B 中间，PA 越来越长，PB 越来越短。到中点 1 时，两边都是 3，“打平”了，差就是 0。<strong>差的正负还能告诉我们位置关系：负数说明更靠近 A，正数说明更靠近 B。</strong>','Drag P right. Between A and B, PA grows while PB shrinks. At the midpoint 1, both are 3—a tie, so the difference is 0. <strong>The sign is a clue: a negative difference means closer to A; a positive one means closer to B.</strong>'],
 why:['3−3=0，说明两段一样长，可不说明 P 站在 0！这里中点是 (−2+4)/2=1。一般中点坐标为 (a+b)/2。记住：归零的是“差”，不是一定要让“坐标”归零。','3−3=0 tells us the distances are equal. It does not put P at coordinate 0! Here the midpoint is (−2+4)/2=1. In general it is (a+b)/2. The difference is zero; the coordinate need not be.'],
 task:'Move P to the midpoint 1 and compare PA with PB.',ask:'What does PA−PB = 0 tell you?',options:['P is equally far from A and B','P must have coordinate 0','P must coincide with A'],line:'D = 0 ⇒ x = (a+b)/2',note:'A zero distance difference does not mean a zero coordinate.'
});
lessonCopy(4,2,{
 title:['只走了 1，差怎么涨了 2？','Move 1 unit—why does the difference grow by 2?'],
 read:['P 在中间向右走 1，发生了两件事：PA 多了 1，PB 少了 1。差相当于“自己加 1，对手又减 1”，一下就增加 2！这里 PA=x−a、PB=b−x。<strong>写减法时，PB 要整段放进括号，不能漏掉后面的 −x。</strong>','When P moves 1 unit right between the endpoints, two things happen: PA gains 1 and PB loses 1. Adding 1 to the first number and taking 1 off the second increases their difference by 2! Here PA=x−a and PB=b−x. <strong>Put the whole PB expression in brackets before subtracting it.</strong>'],
 why:['(x−a)−(b−x)=x−a−b+x=2x−a−b。去掉减号后面的括号时，里面两项都要变号，b 和 −x 都不能漏。这里 D=2x−2，x 从 1 到 2，D 就从 0 到 2，和刚才拖动看到的一样。','(x−a)−(b−x)=x−a−b+x=2x−a−b. The minus sign changes both signs inside the second bracket, not just the first! Here D=2x−2: as x moves from 1 to 2, D goes from 0 to 2, just as the diagram showed.'],
 task:'Move P from 1 to 2 and compare the two values of PA−PB.',ask:'Which expansion of PA−PB is correct?',options:['(x−a)−(b−x)=−a−b','(x−a)−(b−x)=2x−a−b','(x−a)−(b−x)=a−b'],line:'a ≤ x ≤ b: D = 2x−a−b',note:'Between the endpoints, a 1-unit move right increases the difference by 2.'
});
lessonCopy(4,3,{
 title:['两段一起变长，为什么差不变？','Both grow, but the difference stays put'],
 read:['P 越过 B，再向右走。两段距离都在变长，可 PA 永远比 PB 多出一段 AB：<strong>PA=AB+PB</strong>。公共部分一减掉，只剩 AB。于是差的变化路线是：左边 −6，中间慢慢涨到 6，右边就停在 6，不再涨。','Move P past B and farther right. Both distances grow, but PA always contains one extra AB: <strong>PA=AB+PB</strong>. Subtract the shared part and only AB remains. The difference stays at −6 on the left, rises to 6 between the points, then stays at 6 on the right.'],
 why:['P=6 时是 8−2=6，最大只能到 6；左侧最小是 −6。所以 −d≤D≤d。顺便提醒：若题目换成 PB−PA，要把整个结果变号，左边变 +d，右边变 −d。减法可不像加法，交换顺序后，结果要变号。','At P=6, 8−2=6: the maximum is 6, and the minimum on the left is −6. Thus −d≤D≤d. If the question uses PB−PA instead, negate the whole result: the left becomes +d and the right −d. Unlike addition, subtraction cares about order!'],
 task:'Put P at 6. How much longer is PA than PB?',ask:'What are all the possible values of PA−PB?',options:['Only −6 and 6','Any real number','−6 ≤ PA−PB ≤ 6'],line:'x ≥ b: D = b−a = d',note:'Distance difference: −d on the left, increasing in the middle, +d on the right.'
});
lessonCopy(5,0,{
 title:['先判断在哪一段，再求出位置','Find the region, then find the point'],
 read:['来解 |x+2|−|x−4|=2。左侧的差恒为 −6，右侧恒为 6，都不等于 2。那就去中间找！中间 D=2x−2，于是 2x−2=2，解出 x=2。<strong>先判断位置，再选公式，不能把中间的公式直接用于两侧。</strong>','Solve |x+2|−|x−4|=2. The left region only gives −6 and the right only gives 6, so neither can give 2. Look in the middle! There D=2x−2, so 2x−2=2 gives x=2. <strong>Choose the region before choosing the formula.</strong>'],
 why:['−6<2<6，答案只会出现在中间。中间的差向右一直增大，所以只经过 2 一次。一般 −d<k<d 时，2x−a−b=k，得到 x=(k+a+b)/2。算完再看看：它确实在 a 和 b 之间，才放心交卷。','Because −6<2<6, the solution must be in the middle. There the difference increases steadily, reaching 2 only once. In general, −d<k<d gives 2x−a−b=k, so x=(k+a+b)/2. Check that it really lies between a and b.'],
 task:'Find the position where PA−PB = 2. Which region contains P?',ask:'Why is x = 2 the only solution?',options:['Every absolute-value equation has only one solution','The outside regions cannot give 2, and the middle reaches 2 only once','P can only have positive coordinates'],line:'−d < k < d ⇒ x = (k+a+b)/2',note:'The solution here is one point, not two mirror-image points.'
});
lessonCopy(5,1,{
 title:['别漏掉端点左侧的所有位置','Do not stop at the endpoint'],
 read:['题目变成 D=−6。P 在 −2 行不行？行。那让它再往左走呢？两段一起变长，差还是 −6！<strong>所以答案不只是 −2，端点左侧的所有点都满足条件。</strong>如果只写 x=−2，就漏掉了所有 x<−2 的位置。','Now the target is D=−6. Does P=−2 work? Yes. What if P moves farther left? Both distances grow together, so the difference stays −6. <strong>The whole left-hand ray works, not just −2.</strong> Writing only x=−2 would leave out every position with x<−2.'],
 why:['左侧 D 恒等于 −d，而且端点 A 也满足。因此 k=−d 时，x≤a。中间公式只能帮你找到边界 a，但不能据此排除左侧的其他点。这种极值情况，要单独认出来。','On the left, D is always −d, including at A. So k=−d gives x≤a. The middle formula finds the boundary a, but misses the whole ray beyond it. Recognise this extreme-value case separately.'],
 task:'Put P at −5 and check whether the difference is still −6.',ask:'What are all the solutions of |x+2|−|x−4| = −6?',options:['Only x = −2','x ≤ −2','x ≥ 4'],line:'k = −d ⇒ x ≤ a',note:'The minimum difference gives a leftward ray, including its endpoint.'
});
lessonCopy(5,2,{
 title:['差是 +6，右侧哪些点满足？','Difference +6: which points on the right work?'],
 read:['这次要 D=6。P 站在 B，PA=6、PB=0；P 再往右走，PA 仍然只比 PB 多 6。没错，又是一整条射线，不过方向换成右边。<strong>所有 x≥4 的点都满足条件，也包括端点 4。</strong>','This time D must equal 6. At B, PA=6 and PB=0. Farther right, PA still exceeds PB by exactly 6. Another whole ray qualifies, but this time it points right. <strong>Every x≥4 works, including 4 itself.</strong>'],
 why:['右侧 D 恒等于 +d，所以 k=d 时，x≥b。把它和上一种情况配成一对：−d 向左，+d 向右。前提别丢：a<b，而且顺序是 PA−PB。顺序反过来，左右的答案也要跟着换。','On the right, D always equals +d, so k=d gives x≥b. Pair the cases: −d gives the left ray, +d the right ray. Keep the conditions: a<b and the order is PA−PB. Reverse the subtraction and the rays swap roles.'],
 task:'Move P to 6. Does it satisfy the same condition as endpoint B?',ask:'What are all the solutions of |x+2|−|x−4| = 6?',options:['Only x = 4','x ≤ −2','x ≥ 4'],line:'k = d ⇒ x ≥ b',note:'The maximum difference gives a rightward ray, including its endpoint.'
});
lessonCopy(5,3,{
 title:['差有上限，继续移动会怎样？','What happens once the difference reaches its maximum?'],
 read:['想让 D=8？把 P 往右再拖远一点试试。你会发现它还是 6，因为差已经到上限了！再换一道：D≥2。等于 2 的边界是 x=2，往右差只会增大或保持 6，所以 <strong>x≥2 都符合要求。</strong>','Want D=8? Drag P farther right. Still 6! The difference has reached its maximum. Now try D≥2. Equality happens at x=2. To the right, the difference increases and then stays at 6, so <strong>every x≥2 works.</strong>'],
 why:['D=8 无解，因为 |8|>6，超出了 [−6,6]。D≥2 则从边界 2 向右取射线，包含 2；若 D>2，就去掉端点；若 D≤2，就向左取。最后再核对一次：谁减谁？有没有等号？这两个小检查，很能防丢分。','D=8 has no solution because |8|>6, outside [−6,6]. For D≥2, take the ray right from 2, including 2. For D>2, exclude the endpoint; for D≤2, take the left ray. Final checks: which distance comes first, and does the inequality include equality?'],
 task:'Move P farther right to 8. Can the difference reach 8?',ask:'What is the solution of |x+2|−|x−4| ≥ 2?',options:['x ≥ 2','x ≤ 2','Only x = 2'],line:'|k| > d: no solution. Otherwise find the boundary and choose the direction.',note:'Do not borrow the “two outside points” rule for sums when solving a difference problem.'
});


const originalMakeQuestions=makeQuestions;
makeQuestions=function(unit,round){
 const qs=originalMakeQuestions(unit,round);
 let seed=(unit+1)*193+round*7919;const rand=n=>{seed=(seed*1664525+1013904223)>>>0;return seed%n};
 const n=2+rand(6),a=-1-rand(4),d=4+2*rand(3),b=a+d,t=1+rand(3),m=(a+b)/2;
 const abs=z=>z<0?`|x+${-z}|`:z===0?'|x|':`|x−${z}|`,S=`${abs(a)}+${abs(b)}`,D=`${abs(a)}−${abs(b)}`;
 const translations=[
 [
 [`P has coordinate −${n}. How far is P from the origin?`,`Distance is non-negative: |−${n}|=${n}. The minus sign tells you which side of zero P is on.`],
 [`What are all the solutions of |x| = ${n+1}?`,`Start at 0 and go ${n+1} units each way. Both positions count.`],
 ['If |x| = 0, what must x be?','The distance to zero is 0 only when the point is at zero.'],
 [`What are the solutions of |x| = −${n}?`,'No solution: a distance cannot be negative.'],
 [`Compare |−${n+2}| and |${n+2}|.`,`The points are on opposite sides of zero, but each is ${n+2} units from it.`]
 ],[
 [`|x+${n}| measures the distance from point P at x to which fixed point?`,`|x+${n}|=|x−(−${n})|, so the fixed point has coordinate −${n}. Check the address!`],
 [`What is the distance AB between A = ${a} and B = ${b}?`,`AB=|${b}−(${a})|=${d}. Subtract the coordinates, then take the absolute value.`],
 [`What are all the solutions of |x−${n+2}| = 2?`,`The centre is ${n+2}. Move 2 left to ${n}, or 2 right to ${n+4}.`],
 [`A = ${n} and B = ${n+3} are both to the right of zero. What is AB?`,`AB=|${n+3}−${n}|=3. Adding the two distances to zero would count too much.`],
 ['Which expression gives the distance PA from point P at x to point A at a?','Use the absolute value of the difference of the coordinates: |x−a|=|a−x|.']
 ],[
 [`For A = ${a} and B = ${b}, what is the minimum of PA+PB?`,`The minimum is AB=b−a=${d}. Every point on the segment AB reaches it.`],
 [`P is strictly between A = ${a} and B = ${b}. What is PA+PB?`,`PA and PB join to make AB. Their sum stays at ${d}.`],
 [`A = ${a}, B = ${b}: P is ${t} units to the left of A. What is PA+PB?`,`On the left, PB=PA+AB. So the sum is AB+2PA=${d}+2×${t}=${d+2*t}. Count that extra stretch twice!`],
 [`A = ${a}, B = ${b}: P is ${t+1} units to the right of B. What is PA+PB?`,`On the right, PA=AB+PB. The sum is AB+2PB=${d}+2×${t+1}=${d+2*(t+1)}.`],
 [`Which x values make ${S} as small as possible?`,'Every point on AB makes the sum equal AB. Both endpoints count too.']
 ],[
 [`Solve ${S} = ${d-2}.`,`The fixed points are d=${d} apart. The target ${d-2} is below the minimum d, so there is no solution.`],
 [`Find all solutions of ${S} = ${d}.`,'The target equals the distance between the fixed points, so the entire segment [a,b] works.'],
 [`Find all solutions of ${S} = ${d+2*t}.`,`The extra total is ${2*t}. Halve it to get ${t}. Go that far outside each endpoint: x=${a-t} or ${b+t}.`],
 [`Solve ${S} ≤ ${d+2*t}.`,`Equality holds at ${a-t} and ${b+t}. A sum at most the target means between these boundaries, including both endpoints.`],
 [`Solve ${S} ≥ ${d+2*t}.`,`The target exceeds the minimum. Equality holds at ${a-t} and ${b+t}. Moving outwards increases the sum, so take both outside regions, including the boundaries.`]
 ],[
 [`A = ${a}, B = ${b}: P is to the left of A. What is PA−PB?`,`Here PB=PA+AB, so PA−PB=−AB=${-d}.`],
 [`A = ${a}, B = ${b}: P is to the right of B. What is PA−PB?`,`Here PA=AB+PB. Subtract PB and AB=${d} remains.`],
 [`For A = ${a} and B = ${b}, which x gives PA−PB = 0?`,`Equal distances put P at the midpoint: x=(${a}+${b})/2=${m}.`],
 ['P is between A = a and B = b, with a<b. Which expression gives PA−PB?','(x−a)−(b−x)=x−a−b+x=2x−a−b. Change both signs in the second bracket.'],
 [`If PA−PB = ${n}, what is PB−PA?`,'Reverse the subtraction and the whole result changes sign. A distance difference can be negative.']
 ],[
 [`Solve ${D} = 2.`,`Since −${d}<2<${d}, only the middle region can work: x=(2+(${a})+(${b}))/2=${m+1}.`],
 [`Find all solutions of ${D} = ${-d}.`,'The target equals −d, so the entire left ray works, including A. Do not stop at the endpoint!'],
 [`Find all solutions of ${D} = ${d}.`,'The target equals +d, so the entire right ray works, including B.'],
 [`Solve ${D} = ${d+2}.`,`The difference must stay in [−${d},${d}]. The target ${d+2} is outside this range. You cannot use the middle formula outside its region.`],
 [`Solve ${D} ≥ 2.`,`Equality holds at x=${m+1}. PA−PB never decreases as P moves right: choose the boundary and everything to its right.`]
 ]
 ];
 qs.forEach((q,j)=>{addCopy(q.prompt,translations[unit][j][0]);addCopy(q.explain,translations[unit][j][1]);});return qs;
};

function normalizedFill(value){return String(value).normalize('NFKC').trim().toLowerCase().replace(/[−–—﹣]/g,'-').replace(/\s/g,'').replace(/[。；;]$/,'')}

function answerPresent(q,value){return q.kind==='fill'?typeof value==='string'&&value.trim().length>0:Number.isInteger(value)&&value>=0&&value<q.options.length}
function answerCorrect(q,value){return q.kind==='fill'?checkFill(q,value):q.options[value]===q.correct}
function answeredCount(i,p){const qs=makeQuestions(i,p.round,p.format);return p.answers.filter((v,j)=>answerPresent(qs[j],v)).length}
function displayAnswer(q,value){return !answerPresent(q,value)?'未作答':q.kind==='fill'?String(value):q.options[value]}
function validStoredAnswer(q,value,submitted){if(q.kind==='fill')return value===-1||typeof value==='string'&&value.length<=80;return Number.isInteger(value)&&value>=-1&&value<q.options.length}

function barsHTML(pa,pb,sum,d){if(sum)return sumBarsHTML(pa,pb,d);const scale=420/Math.max(20,pa+pb,pa,pb),a=pa*scale,b=pb*scale,common=Math.min(a,b);return `<div class="observeeq">${num(pa)} ${sum?'+':'−'} ${num(pb)} = ${num(sum?pa+pb:pa-pb)}</div><svg class="barchart" viewBox="0 0 560 ${sum?74:111}" role="img" aria-label="${sum?'两段首尾相接表示距离和':'两段左端对齐，相同的部分抵消，剩余部分决定距离差'}">${sum?`<text x="8" y="27" fill="#536b51" font-size="18">相加</text><rect x="77" y="9" width="${a}" height="23" rx="3" fill="#1666b2"/><rect x="${77+a}" y="9" width="${b}" height="23" rx="3" fill="#8150af"/><text x="8" y="62" fill="#536b51" font-size="18">AB</text><rect x="77" y="46" width="${d*scale}" height="15" rx="3" fill="#a5bb80"/><text x="${83+d*scale}" y="61" fill="#536b51" font-size="17">${d}</text>`:`<text x="8" y="26" fill="#1666b2" font-size="18">PA</text><rect x="77" y="7" width="${a}" height="23" rx="3" fill="#1666b2"/><text x="8" y="64" fill="#8150af" font-size="18">PB</text><rect x="77" y="46" width="${b}" height="23" rx="3" fill="#8150af"/><rect x="77" y="3" width="${common}" height="69" fill="#fff" opacity=".62"/><text x="280" y="99" fill="#667965" font-size="18" text-anchor="middle">淡色部分相互抵消；${pa>pb?'PA 多出的一段使差为正':pa<pb?'PB 多出的一段使差为负':'两段一样长，差为 0'}</text>`}</svg>`}

function renderQuiz(){const i=state.unit,p=state.parts[i],qs=makeQuestions(i,p.round),result=currentResult(),g=result?grade(i,result):null;return lessonShell(`<section class="card quizintro"><div><div class="eyebrow">五题检测 · 检查理解，自由继续</div><h3 style="margin-top:8px">用你刚才发现的方法，独立完成</h3><p>本轮答案会保留。完成后提交可查看解析，也可以先继续学习。</p><div class="btnrow" style="margin-top:15px"><button data-action="backLearn">← 返回本关讲解</button></div></div><div class="round">第 ${p.round} 轮</div></section>${result?resultHTML(g):''}<div id="questionList">${qs.map((q,j)=>`<section class="card quizcard" id="q${j}"><div class="qnum">检测 ${j+1} / 5 ${g?(g[j]?'· ✓ 正确':'· 需再想一想'):''}</div><h3>${esc(q.prompt)}</h3><div class="choices" role="radiogroup" aria-label="第 ${j+1} 题">${q.options.map((o,k)=>`<button role="radio" aria-checked="${p.answers[j]===k}" class="choice ${p.answers[j]===k?'selected':''} ${g?(o===q.correct?'correct':p.answers[j]===k?'incorrect':''):''}" data-action="answer" data-question="${j}" data-option="${k}" ${result?'disabled':''}><span class="letter">${String.fromCharCode(65+k)}</span><span>${esc(o)}</span></button>`).join('')}</div>${g?`<details ${g[j]?'':'open'}><summary>${g[j]?'查看思路':'看一看错在哪里'}</summary><p><strong>正确答案：${esc(q.correct)}</strong><br>${esc(q.explain)}</p></details>`:''}</section>`).join('')}</div>${!result?`<div class="submitbar"><div><strong id="answerCount">已选择 ${p.answers.filter(n=>n>=0).length} / 5 题</strong><span class="small">检测成绩不限制继续学习</span></div><button class="primary" data-action="submit">提交本轮五题</button></div>`:`<div class="btnrow" style="margin-top:20px">${g.every(Boolean)?`<button class="primary" data-action="${i===5?'report':'open'}" ${i===5?'':`data-unit="${i+1}"`}>${i===5?'查看我的知识总结 →':'进入下一关 →'}</button>`:'<button class="primary" data-action="relearn">复习薄弱处，再挑战一轮 →</button>'}</div>`}`)}
function resultHTML(g){const yes=g.every(Boolean);return `<section class="card result ${yes?'':'fail'}"><div class="resultline"><span class="score">${g.filter(Boolean).length}<span style="font-size:23px"> / 5</span></span><h3>${yes?'本轮五题全对。':'还有几处值得再想一想。'}</h3></div><p>检测帮助你发现需要复习的地方。可以查看解析、再练一轮，也可以直接继续学习。</p><div class="btnrow">${nextUnitButton()}<button data-action="relearn">回看相关讲解</button><button data-action="newRound">再练一轮</button></div></section>`}

function renderMistakes(){const ms=mistakeList();return `<div class="wrap" style="max-width:1000px"><div class="sectionhead"><div><div class="eyebrow">每次错误，都能找到原因</div><h2>我的错题 · ${ms.length} 道</h2></div><button data-action="home">返回路线</button></div><p class="muted" style="font-size:14px">记录每轮最新提交中的错题。补做与订正后，本轮记录会更新；其他轮次的记录保留。</p>${ms.length?ms.map(m=>`<section class="card reviewitem"><div class="eyebrow">第 ${m.unit+1} 关 · ${UNITS[m.unit].short} · 第 ${m.round} 轮</div><h3 style="margin-top:8px">${esc(m.q.prompt)}</h3><p><span style="color:var(--red)">当时作答：${esc(m.selected)}</span><br><strong>正确答案：${esc(m.q.correct)}</strong></p><details><summary>查看分步解析与数轴</summary>${questionAnalysisHTML(m.q,quizAnalysisSpec(m.unit,m.round,m.format,m.index),`mistake-${m.unit}-${m.round}-${m.index}`)}</details><button style="margin-top:15px" data-action="reviewLink" data-unit="${m.unit}" data-step="${m.q.review}">回到对应的讲解 →</button></section>`).join(''):'<div class="card empty"><h3>这里还没有错题</h3><p class="muted">完成一次五题检测后，需要巩固的题会自动记在这里。</p><button style="margin-top:20px" class="primary" data-action="home">回到学习路线</button></div>'}</div>`}
function miniAxis(type){const left=type==='left',right=type==='right',segment=type==='segment';return `<svg class="mini-axis" viewBox="0 0 450 74" role="img" aria-label="${left?'x小于等于a，向左射线':right?'x大于等于b，向右射线':'a到b的闭线段'}"><line x1="20" x2="430" y1="27" y2="27" stroke="#a3b39b" stroke-width="2"/><line x1="${left?25:segment?120:330}" x2="${left?120:segment?330:425}" y1="27" y2="27" stroke="${segment?'#246c50':'#8150af'}" stroke-width="6"/>${left?'<path d="M39 18L23 27L39 36" fill="none" stroke="#8150af" stroke-width="4"/>':right?'<path d="M412 18L428 27L412 36" fill="none" stroke="#8150af" stroke-width="4"/>':''}<circle cx="120" cy="27" r="6" fill="${left||segment?'#246c50':'#a3b39b'}"/><circle cx="330" cy="27" r="6" fill="${right||segment?'#8150af':'#a3b39b'}"/><text x="120" y="60" font-size="21" fill="#173c38" text-anchor="middle">a</text><text x="330" y="60" font-size="21" fill="#173c38" text-anchor="middle">b</text></svg>`}
function renderReport(){return `<div class="wrap" style="max-width:1120px"><div class="reporthead"><div class="eyebrow">知识总结 · 随时回顾</div><h1>看见距离，就有解题的方向。</h1><p>遇到绝对值，先找固定点，再看 P 在哪里，最后决定式子怎样计算。下面的总结可以随时查看。</p></div>${statsHTML()}${exitGatewayHTML()}${threeRegionSummaryHTML()}<section class="card"><h3>先把符号翻译成距离</h3><div class="summarygrid"><div><p><span class="blue"><strong>|x| = PO</strong></span><br>坐标为 x 的点 P 到原点 O 的距离。</p><p><span class="blue"><strong>|x−a| = PA</strong></span><br>坐标为 x 的点 P 到坐标为 a 的点 A 的距离；|x+2| 的固定点是 −2。</p><p><strong>AB = |b−a| = |a−b|</strong><br>任意两点的距离 = 坐标之差的绝对值。</p></div><div>${axisArt()}</div></div></section><div class="summarygrid"><section class="card summarycard sum"><div class="eyebrow">相加 · 没有绕路时最小</div><h3>距离和 S=PA+PB</h3><div class="bigformula">最小值是 d=b−a</div><p>以下都默认 a&lt;b。P 在中间时，两段拼成 AB；在外侧时，多出的路算了两次。</p>${miniAxis('segment')}<div class="case"><b>目标 k&lt;d → 无解</b>目标比最小总和还小。</div><div class="case"><b>目标 k=d → a≤x≤b</b>整条闭线段，包括两个端点。</div><div class="case"><b>目标 k&gt;d → 两个点</b>先算 t=(k−d)/2，再从 A 向左、从 B 向右各走 t。<br>x=a−t 或 x=b+t。</div><div class="case"><b>不等式：先找边界，再判断内外</b>k&gt;d 时：S≤k 取两边界之间；S≥k 取两边界外侧。严格不等号不含边界。<br>k=d 时：S≤d 取 [a,b]，S≥d 取所有实数。</div></section><section class="card summarycard diff"><div class="eyebrow">相减 · 顺序决定正负</div><h3>距离差 D=PA−PB</h3><div class="bigformula" style="color:var(--purple)">−d ≤ D ≤ d</div><p>左侧 −d；中间 2x−a−b；右侧 +d。把 PA−PB 换成 PB−PA，结果整体变号。</p><div class="case"><b>目标 |k|&gt;d → 无解</b>差不可能超出 [−d,d]。</div><div class="case"><b>目标 k=−d → x≤a</b>${miniAxis('left')}</div><div class="case"><b>目标 −d&lt;k&lt;d → 一个点</b>x=(k+a+b)/2，代回检查位置在 (a,b)。</div><div class="case"><b>目标 k=d → x≥b</b>${miniAxis('right')}</div><div class="case"><b>不等式：先找边界，再看方向</b>−d&lt;k&lt;d 时，设边界 c=(k+a+b)/2。D≥k 取 x≥c；D≤k 取 x≤c。</div></section></div><section class="card" style="margin-top:20px"><h3>每一关的学习记录</h3><table class="reporttable"><thead><tr><th>关卡</th><th>提交轮次</th><th>最佳检测成绩</th><th>总正确率</th></tr></thead><tbody>${state.parts.map((p,i)=>{const c=p.history.reduce((n,h)=>n+grade(i,h).filter(Boolean).length,0);return `<tr><td>${i+1}. ${UNITS[i].short}</td><td>${p.history.length}</td><td>${p.history.length?Math.max(...p.history.map(h=>grade(i,h).filter(Boolean).length))+' / 5':'尚未检测'}</td><td>${p.history.length?Math.round(c/(p.history.length*5)*100)+'%':'—'}</td></tr>`}).join('')}</tbody></table><div class="btnrow" style="margin-top:20px"><button class="primary" data-action="home">回到路线复习</button><button data-action="mistakes">查看所有错题</button><button data-action="export">导出交给老师</button></div><p class="small" style="margin-top:12px">学习记录会下载为 JSON 文件。请把这个文件发送给老师，老师导入教师端后才能查看。未完成也可以导出；订正后请重新导出。</p></section></div>`}

 ['第七关 · 选做拓展','Stage 7 · Optional extension'],['三个、四个、五个绝对值的和','Sums of three, four and five absolute values'],['本关不属于本课必学内容，不计入六关进度，也不影响出门条。想继续探究时再来。','This optional extension is outside the core lesson. It does not count toward the six stages or affect the exit ticket. Explore it whenever you like.'],['3 个绝对值','3 absolute values'],['4 个绝对值','4 absolute values'],['5 个绝对值','5 absolute values'],['先把每个绝对值读成一段距离','Read each absolute value as one distance'],['每一项都是 P 到一个固定点的距离。拖动 P，看哪些距离变长、哪些变短，总和又怎样变化。','Each term is a distance from P to a fixed point. Drag P and compare the individual distances and their sum.'],['按位置试一试，再比较','Try these positions and compare'],['重点看：总和最小时，P 是否正好落在正中间那个固定点？','Watch for the minimum: is P at the middle fixed point?'],['重点看：在中间两个固定点之间移动，总和会变吗？端点算不算？','Move between the two middle fixed points. Does the sum change? Do the endpoints count?'],['从两端开始，一对一对地配','Pair points from the two ends inward'],['把最左和最右的固定点配成一对，再把剩下的最左和最右配成一对。每一对都可以用“两段距离和”的结论。','Pair the leftmost and rightmost points, then pair the next outermost points. Apply the two-distance sum rule to each pair.'],['要让总和最小，就让每一对同时取到最小值，再处理没有配对的那一项。','Minimize all pairs at the same time, then handle any unpaired term.'],['记录当前总和','Record this sum'],['把观察变成结论','Turn observations into a conclusion'],['奇数个：找正中间那个固定点','Odd number: choose the middle fixed point'],['偶数个：找中间两个固定点之间的一段','Even number: choose the interval between the middle two'],['最小值','Minimum'],['两端配好后，正中间还剩一个绝对值。它要等于 0，P 就必须与中间固定点重合；此时每一对距离和也都最小。','After pairing from the ends, one middle term remains. It is zero only at the middle fixed point; all pairs also attain their minima there.'],['两端配成的每一对都要求 P 在这一对固定点之间。共同满足这些要求的范围，正好是中间两个固定点之间的整段。','Every pair is minimized between its endpoints. The overlap of these intervals is exactly the interval between the two middle fixed points.'],['奇中点，偶中段','Odd: middle point. Even: middle interval.'],['先按固定点的坐标从小到大排序，再找中间。','Sort the fixed-point coordinates from smallest to largest, then f function extraPairBars(){const d=extraData(),x=state.extra.x,unit=520/22,rows=Math.floor(d.n/2);let bars='';for(let k=0;k<rows;k++){const j=d.n-1-k,aa=String.fromCharCode(65+k),bb=String.fromCharCode(65+j),a=Math.abs(x-d.points[k]),b=Math.abs(x-d.points[j]),gap=d.points[j]-d.points[k],y=30+k*100,col=k?'#8150af':'#1666b2';bars+=`<text x="30" y="${y-8}" font-size="21" fill="${col}"><tspan>P${aa}</tspan><tspan fill="${extraColor(j)}"> + P${bb}</tspan><tspan fill="#173c38"> = ${a+b}</tspan></text><rect x="30" y="${y}" width="${a*unit}" height="20" fill="${col}"/><rect x="${30+a*unit}" y="${y}" width="${b*unit}" height="20" fill="${extraColor(j)}"/><rect x="30" y="${y+31}" width="${gap*unit}" height="12" fill="#a3b992"/><text x="${40+gap*unit}" y="${y+43}" font-size="20" fill="#456156">${aa}${bb} = ${gap}</text>`;}return `<svg class="extra-pair-bars" viewBox="0 0 600 ${rows*100}" role="img" aria-label="配对距离和与固定点距离的对照">${bars}</svg>`}

function extraColor(i){return ['#1666b2','#8150af','#087f80','#b63865','#866300'][i]}
function extraText(z,en){addCopy(z,en);return esc(z)}
function extraPhase(){return [0,1,2].includes(state.extra.phase)?state.extra.phase:0}
function extraTrials(){const d=extraData();return d.n===3?[[-4,-2,1],[-4,0,1],[-5,1,3,5,6]][extraPhase()]:d.n===4?[-2,-1,1,3,4]:[-3,0,1,2,4]}
function extraDistanceChips(x,reveal=true){return extraData().points.map((a,i)=>{const letter=String.fromCharCode(65+i);return `<span class="extra-distance-chip" style="--distance-color:${extraColor(i)}"><b>P${letter} = ${reveal?num(Math.abs(x-a)):'?'}</b><small>${extraText(`P 到 ${letter} 的距离`,`Distance from P to ${letter}`)}</small></span>`}).join('')}
function extraGuidedTasks(){const d=extraData(),saved=state.extra.records[d.n]||[];return `<div class="task extra-task-block"><b>${extraText('动一动 · 按颜色逐段观察','Try it · Follow each colored distance')}</b><ol class="qa-tasks">${extraTrials().map((x,i)=>`<li class="extra-task-row ${state.extra.x===x?'current':''}"><p>${extraText(`${i+1}. 把 P 拖到 ${x}，逐段读出下面这些距离，再算总和。`,`${i+1}. Drag P to ${x}, read each distance below, then calculate the sum.`)}</p><div class="extra-task-distances">${extraDistanceChips(x,state.extra.x===x||saved.includes(x))}</div></li>`).join('')}</ol><p class="small">${extraText('拖到指定位置时，这一行会显示读数；点“记录当前总和”可保留它，再与其他位置比较。','At a target position, its readings appear here. Use “Record this sum” to keep them for comparison.')}</p></div>`}
function extraThreeStory(){const phase=extraPhase();const tabs=[['1. 先看两项','1. Start with two terms'],['2. 再加第三项','2. Add the third term'],['3. 检查并总结','3. Check and conclude']];let body='';
 if(phase===0)body=`<h3>${extraText('先让两段距离的和最小','First minimize the sum of two distances')}</h3><p>${extraText('前面已经学过，两段距离的和在两个定点之间最小。现在先只研究蓝色 PA 和紫色 PB：A 在 −4，B 在 1，所以 |x+4|+|x−1| 就是 PA+PB。青色 PC 先留着作对照，这一步先不把它加入目标。','Recall that a sum of two distances is smallest between its fixed points. Start with blue PA and purple PB: A is at −4 and B at 1, so |x+4|+|x−1| is PA+PB. Keep teal PC in view for comparison, but do not include it in our target yet.')}</p><p>${extraText('把 P 依次拖到 −4、−2、1。蓝色和紫色各有多长？两段拼起来是不是一直为 5？注意，我们找到的不是一个位置，而是 −4 到 1 的整段，两个端点也算。先确认这一点，再去看第三段。','Drag P to −4, −2 and 1. How long are the blue and purple distances? Does their sum stay at 5? The minimum is attained throughout the interval from −4 to 1, including both endpoints. Confirm this before adding the third distance.')}</p>`;
 if(phase===1)body=`<h3>${extraText('两段的和不变，第三段怎样变？','Two distances have a constant sum. What about the third?')}</h3><p>${extraText('现在把 C 固定在 5，加上青色 PC，也就是 |x−5|。我们先让 P 留在刚才的 −4 到 1 之间：蓝色 PA 与紫色 PB 加起来仍然是 5。这时要让三段总和更小，就要看看青色 PC 能不能再短一点。','Now fix C at 5 and add teal PC, which is |x−5|. First keep P between −4 and 1: blue PA plus purple PB remains 5. To reduce the total of all three distances, look for a shorter teal PC.')}</p><p>${extraText('依次试 −4、0、1。先核对两段小计，再看 PC：它从 9 变成 5，再变成 4；三段总和又变成多少？在这一段里，向右走会更接近 C，所以走到 1 时总和最小。但这还只比较了 −4 到 1，我们还要检查外面的点。','Try −4, 0 and 1. Check the subtotal of PA and PB, then watch PC decrease from 9 to 5 to 4. What happens to the three-distance total? In this interval, moving right brings P closer to C, so x=1 gives the smallest total here. We still need to check positions outside this interval.')}</p>`;
 if(phase===2)body=`<h3>${extraText('为什么再向右走，反而不会更小？','Why does moving farther right stop helping?')}</h3><p>${extraText('先试 1、3、5。P 从 1 向右走到 5 的过程中，PA、PB 都变长，PC 变短。每向右 1，前两段合起来增加 2，第三段只减少 1，总和反而增加 1。再试 −5 和 6，看看跑到最外侧能不能得到更小的数。','Try 1, 3 and 5. As P moves from 1 toward 5, PA and PB both grow while PC shrinks. Each step of 1 adds 2 to the first two distances but removes only 1 from the third, so the total grows by 1. Also try −5 and 6 to compare the outer positions.')}</p><p>${extraText('只试几个点还不够，我们换个配对方法，把理由说完整：蓝色 PA 加青色 PC 至少等于 AC=9；紫色 PB 至少为 0。因此三段总和至少为 9。P 在 1 时，PA+PC=5+4=9，同时 PB=0，刚好达到这个下限。','A few trials are not a proof. Pair the distances differently: blue PA plus teal PC is at least AC=9, and purple PB is at least 0. Thus the total is at least 9. At x=1, PA+PC=5+4=9 and PB=0, so this lower bound is attained.')}</p><p>${extraText('这就是三个绝对值找中间定点的原因：两端配成一对，剩下中间那段必须为 0。这里的中间点是 B，坐标为 1。','This explains the middle-point rule for three absolute values: pair the two outer points, then make the remaining middle distance zero. Here the middle fixed point is B, at 1.')}</p>`;
 return `<div class="extra-story"><div class="extra-phase-tabs">${tabs.map(([z,en],i)=>`<button data-extra-phase="${i}" class="${phase===i?'active':''}" aria-pressed="${phase===i}">${extraText(z,en)}</button>`).join('')}</div>${body}</div>`;
}

html=html.replace('拖动橙色 P，观察配对的两端',extraText('拖动橙色 P，逐段看距离与总和','Drag orange P and watch each distance and the total'));html=html.replace('下方绿色点或线段：让距离总和最小的 P 的位置。',extraText(d.n===3&&extraPhase()<2?'绿色参照段：前两项 PA+PB 取最小值的位置。':'绿色参照位置：全部距离的总和最小。',d.n===3&&extraPhase()<2?'Green interval: where the first two terms PA+PB are minimized.':'Green reference: where the total of all distances is minimized.'));return html}
function extraSVG(){const d=extraData(),x=state.extra.x,X=v=>40+(v+8)/17*520,ay=35+d.n*46,h=ay+196,dist=d.points.map(a=>Math.abs(x-a)),sum=dist.reduce((a,b)=>a+b,0);let strokes='',ticks='';
 for(let i=0;i<d.n;i++){const a=d.points[i],y=28+i*46,col=extraColor(i),mid=Math.max(70,Math.min(530,(X(a)+X(x))/2));strokes+=`<g data-distance="P${String.fromCharCode(65+i)}" data-length="${dist[i]}"><path d="M${X(a)} ${ay}V${y}H${X(x)}V${ay}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round"/><text x="${mid}" y="${y-8}" text-anchor="middle" font-size="21" font-weight="700" fill="${col}">P${String.fromCharCode(65+i)} = ${num(dist[i])}</text></g>`}

 function queue(){if(!active)return;clearTimeout(saveTimer);saveTimer=setTimeout(persist,220);if(net){clearTimeout(syncTimer);syncTimer=setTimeout(sync,1000)}}
 function eventPush(rows,e){rows.push(e);if(rows.length>500)rows.splice(1,1)}
 function packet(){persist();return{kind:'student-report',version:1,course:CR_COURSE,learner:{id:active.id,name:active.name},revision:active.revision,exportedAt:new Date().toISOString(),state:active.state,audit:active.audit}}
 function toolbar(){let bar=document.querySelector('#studentToolbar');if(!bar){bar=document.createElement('section');bar.id='studentToolbar';bar.className='role-toolbar';bar.dataset.i18nIgnore='';document.querySelector('.language-control').insertAdjacentElement('afterend',bar)}bar.innerHTML=active?`<strong>${tr('学生：'+active.name,'Student: '+active.name)}</strong><span class="small">${net?esc(syncStatus):tr('记录保存在本机 · 导出后交给老师','Saved on this device · Export for your teacher')}</span><div class="btnrow"><button data-student-action="export" class="primary">${tr('导出交给老师','Export for teacher')}</button>${net?'<button data-student-action="sync">立即同步</button>':''}<button data-student-action="switch">${tr('切换姓名','Switch student')}</button></div>`:'';document.title='绝对值破局者 · 学生端'}
 save=function(){baseSave();queue()};render=function(...a){baseRender(...a);toolbar()};
 reflect=function(k){if(active&&state.screen==='learn'&&!state.parts[state.unit].done[state.step]){eventPush(audit.steps[state.unit][state.step].attempts,{choice:k,at:new Date().toISOString()});queue()}return baseReflect(k)};
 nextStep=function(){if(active){audit.steps[state.unit][state.step].readAt||=new Date().toISOString();queue()}return baseNext()};
 movePoint=function(v){const result=baseMove(v);if(active&&state.screen==='learn'){const positions=audit.steps[state.unit][state.step].positions,x=state.parts[state.unit].x;if(!positions.includes(x)){positions.push(x);if(positions.length>100)positions.splice(1,1)}queue()}return result};
 finishUnit=function(){const i=state.unit,p=state.parts[i],fresh=!currentResult();if(active&&fresh)eventPush(audit.quizzes[i],{round:p.round,format:p.format,answers:p.answers.slice(),at:new Date().toISOString()});return baseFinish()};
 submitExit=function(){if(active&&state.screen==='exitTicket'&&sixStagesStudied()&&!exitPassed()&&state.exitTicket.editing)eventPush(audit.exits,{answers:state.exitTicket.answers.slice(),at:new Date().toISOString()});return baseExit()};
 function exportForTeacher(){if(!active)return;try{const report=packet();crValidate(report);const filename='学习记录_'+active.name.replace(/[\\/:*?"<>|]/g,'_')+'_'+report.revision+'.json';crDownload(filename,report);let receipt=document.querySelector('#exportReceipt');if(!receipt){receipt=document.createElement('section');receipt.id='exportReceipt';receipt.className='role-toolbar';receipt.dataset.i18nIgnore='';receipt.setAttribute('role','status');document.querySelector('#studentToolbar').after(receipt)}receipt.innerHTML='<div><strong>已发起下载 / Download requested</strong><p style="margin:4px 0;overflow-wrap:anywhere">'+esc(filename)+'</p><small>请在浏览器下载列表或“文件”中找到此 JSON 文件，通过老师指定的平台发送。导出不会自动发送给老师；订正后请重新导出。<br>Find the JSON file in Downloads or Files and send it to your teacher. Exporting does not send it automatically.</small></div>';toast('请保存下载的 JSON 文件，再发送给老师。')}catch(e){toast('导出未完成，请保留当前页面并重试。')}}
 function gate(){document.body.classList.add('student-locked');let box=document.querySelector('#studentGate');if(!box){box=document.createElement('main');box.id='studentGate';box.dataset.i18nIgnore='';document.body.append(box)}box.hidden=false;box.innerHTML=`<section class="card signin-card"><div class="eyebrow">绝对值破局者 · 学生端</div><h1>先写下你的名字<small style="display:block;font-size:20px;margin-top:8px">Enter your name to begin</small></h1><p>输入姓名后开始学习；再次输入同一姓名，可继续这台设备上保存的进度。<small style="display:block">Use the same name and browser to continue your saved work.</small></p><form id="studentSignin"><label for="studentName">姓名 <span class="small">同名同学可加学号区分</span></label><input id="studentName" maxlength="50" autocomplete="name" required placeholder="请输入姓名">${legacy?'<label style="font-size:14px;line-height:1.7"><input id="adoptPrevious" type="checkbox" style="width:auto;margin-right:8px">把本机旧版的学习进度归到这个姓名（仅在确认是自己的记录时勾选）<small style="display:block">Use the earlier progress on this device only if it is yours.</small></label>':''}<button class="primary" type="submit">进入学习 → / Start learning</button></form><p id="signinError" role="status"></p><p class="small">${net?'答题记录会同步到教师电脑。连接暂时中断时仍可学习，也能导出记录。':'学习结束后点击“导出交给老师”，把 JSON 记录文件发给老师。老师导入后才能查看答题情况。<br>Export your JSON record and send it to your teacher after learning.'}</p><p class="small">姓名用于区分学习记录，无需密码。本机记录不会自动出现在另一台设备。</p></section>`;box.querySelector('input').focus()}
 function login(name){name=name.trim().replace(/[\u0000-\u001f]/g,'');if(!name||name.length>50)return;active=profiles.find(p=>p.name===name);if(!active){active={id:globalThis.crypto?.randomUUID?crypto.randomUUID():'student-'+Date.now()+'-'+Math.random().toString(36).slice(2),name,revision:0,state:legacy&&document.querySelector('#adoptPrevious')?.checked?legacy:freshState(),audit:crAudit()};if(active.state===legacy){localStorage.setItem('absolute-classroom-legacy-claimed-v1',active.id);legacy=null}profiles.push(active)}
  try{localStorage.setItem(STORE_KEY,JSON.stringify(active.state));state=loadState();audit=active.audit||crAudit();crValidate({kind:'student-report',version:1,course:CR_COURSE,learner:{id:active.id,name},revision:Math.max(1,active.revision),exportedAt:new Date().toISOString(),state,audit})}catch{state=freshState();audit=crAudit();toast('旧记录无法读取，已打开新的学习记录。')}
  document.body.classList.remove('student-locked');document.querySelector('#studentGate').hidden=true;render();persist();if(net)sync();
 }
 async function request(url,options){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timer)}}
 async function sync(){if(!net||!active||syncBusy)return;syncBusy=true;const person=active;try{const report=packet();syncStatus='正在同步…';toolbar();if(!person.registered){person.token||=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');writeProfiles();const r=await request('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:person.id,name:person.name,token:person.token})});if(!r.ok)throw Error('register');person.token=(await r.json()).token;person.registered=true;writeProfiles()}const r=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json','X-Student-Token':person.token},body:JSON.stringify(report)});if(!r.ok){if(r.status===403)person.registered=false;throw Error('upload')};syncStatus='✓ 已同步到教师电脑 · '+new Date().toLocaleTimeString('zh-CN')}catch{syncStatus='连接未成功，记录仍在本机；可重试或导出'}finally{syncBusy=false;toolbar()}}
 document.addEventListener('submit',e=>{if(e.target.id==='studentSignin'){e.preventDefault();login(document.querySelector('#studentName').value)}});
 document.addEventListener('click',e=>{const action=e.target.closest('[data-student-action]')?.dataset.studentAction;if(action==='export')exportForTeacher();if(action==='sync')sync();if(action==='switch'){persist();document.querySelector('#exportReceipt')?.remove();active=null;clearTimeout(syncTimer);gate()}},false);
 document.addEventListener('click',e=>{if(e.target.closest('[data-action="confirmReset"]')&&active)audit=crAudit()},true);
 window.addEventListener('beforeunload',persist);if(net)setInterval(()=>{if(active)sync()},15000);
 exportRecord=exportForTeacher;toolbar();gate();
 window.studentClassroom={packet,login,getAudit:()=>audit,getActive:()=>active};
})();

</script></body></html>
